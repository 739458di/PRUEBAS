<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Panel</title>
<style>
:root{--bg:#FFFFFF;--s1:#F6F6F7;--s2:#ECECEE;--ln:#E3E3E6;--txt:#111114;--txt2:#5B5B63;--muted:#8A8A93;--ok:#1E8E5A;--warn:#8A6D00;--danger:#C62828;--r:12px;--font:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--txt);background:var(--bg);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
a{color:inherit}button{font-family:inherit}
/* ── login ── */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{width:100%;max-width:380px}
.login h1{font-size:22px;letter-spacing:-.02em;margin:0 0 4px}.login p{color:var(--txt2);margin:0 0 22px}
.inp{width:100%;height:46px;border:1px solid var(--ln);border-radius:10px;padding:0 14px;font-size:15px;background:#fff;color:var(--txt);outline:none}.inp:focus{border-color:#111}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--txt2);margin:14px 0 6px;letter-spacing:.02em}
.btn{height:46px;border:0;border-radius:10px;background:#111;color:#fff;font-size:15px;font-weight:600;width:100%;cursor:pointer}.btn[disabled]{opacity:.5}
.btn.sec{background:#fff;color:#111;border:1px solid var(--ln)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}
/* ── app ── */
.app{display:none;min-height:100%}
.app.on{display:grid;grid-template-columns:240px 1fr}
.side{border-right:1px solid var(--ln);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.marca{font-weight:700;font-size:17px;letter-spacing:-.01em;padding:6px 10px 14px}.marca small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--txt2);cursor:pointer;border:0;background:none;text-align:left;font-size:14px}
.nav.on{background:var(--s1);color:var(--txt);font-weight:600}.nav svg{width:18px;height:18px;flex:0 0 18px}
.side .sp{flex:1}.side .foot{border-top:1px solid var(--ln);padding-top:12px;font-size:12px;color:var(--muted)}
.main{padding:28px 32px;max-width:1100px}
h2{font-size:22px;letter-spacing:-.02em;margin:0 0 4px}.sub{color:var(--txt2);margin:0 0 22px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.kpi{border:1px solid var(--ln);border-radius:var(--r);padding:16px}.kpi b{display:block;font-size:26px;letter-spacing:-.02em}.kpi span{color:var(--txt2);font-size:13px}
.card{border:1px solid var(--ln);border-radius:var(--r);padding:14px;background:#fff}
.auto{display:flex;gap:12px;align-items:center}.auto img,.auto .ph{width:72px;height:54px;border-radius:8px;object-fit:cover;background:var(--s2);flex:0 0 72px}
.auto .t{font-weight:600}.auto .s{color:var(--txt2);font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--s1);color:var(--txt2)}
.tag.ok{background:#E7F5EE;color:var(--ok)}.tag.warn{background:#FBF3D9;color:var(--warn)}.tag.off{background:#F3F3F4;color:var(--muted)}
/* calendario */
.calh{display:flex;align-items:center;gap:8px;margin-bottom:10px}.calh b{font-size:16px;flex:1}
.calh button{width:34px;height:34px;border:1px solid var(--ln);background:#fff;border-radius:9px;cursor:pointer;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cal .d{min-width:0;overflow:hidden}.cal .dn{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
.cal .d{min-height:78px;border:1px solid var(--ln);border-radius:8px;padding:6px;font-size:12px;background:#fff}.cal .d.out{background:var(--s1);color:var(--muted)}.cal .d.hoy{border-color:#111}
.cal .d .n{font-weight:600;margin-bottom:4px}.cal .ev{display:block;font-size:11px;line-height:14px;padding:2px 5px;border-radius:5px;background:#111;color:#fff;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.fin{background:var(--s2);color:var(--txt2)}.cal .ev.camino{background:var(--ok)}
.lista{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.item{display:flex;gap:12px;align-items:center;border:1px solid var(--ln);border-radius:10px;padding:10px 12px}.item .t{font-weight:600}.item .s{color:var(--txt2);font-size:13px}.item .sp{flex:1}
.item .ava{width:36px;height:36px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 36px}
.x{border:1px solid var(--ln);background:#fff;border-radius:8px;height:32px;padding:0 10px;cursor:pointer;font-size:13px}
.form{border:1px solid var(--ln);border-radius:var(--r);padding:16px;max-width:460px;margin-top:18px}
.form h3{margin:0 0 4px;font-size:15px}.form p{margin:0;color:var(--txt2);font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vacio{color:var(--muted);padding:18px 0}
.tabs{display:none}.topbar{display:none}
@media (max-width:760px){
  .app.on{grid-template-columns:1fr}.side{display:none}.main{padding:14px 16px 84px}
  .topbar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:#fff;z-index:2}.topbar b{font-size:16px}.topbar .sp{flex:1}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabs button{flex:1;border:0;background:none;font-size:11px;color:var(--txt2);padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px}.tabs button.on{color:#111;font-weight:600}.tabs svg{width:20px;height:20px}
  .row2{grid-template-columns:1fr}
  .cal{gap:2px}.cal .d{min-height:58px;padding:3px;border-radius:6px}.cal .d .n{font-size:11px}.cal .ev{font-size:9px;line-height:12px;padding:1px 3px;border-radius:4px}
}
</style>
</head>
<body>
<div class="login" id="login">
  <div class="card">
    <h1 id="lg-marca">Panel</h1>
    <p>Inicia sesión con tu usuario y contraseña.</p>
    <label class="lbl" for="lg-u">Usuario</label><input class="inp" id="lg-u" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="tu usuario">
    <label class="lbl" for="lg-p">Contraseña</label><input class="inp" id="lg-p" type="password" autocomplete="current-password" placeholder="••••••••">
    <div class="err" id="lg-err"></div>
    <button class="btn" id="lg-go">Entrar</button>
  </div>
</div>
<div class="app" id="app">
  <aside class="side">
    <div class="marca" id="sd-marca">Panel<small id="sd-nombre"></small></div>
    <button class="nav on" data-v="inicio">${ico('home')}Inicio</button>
    <button class="nav" data-v="autos">${ico('car')}Autos</button>
    <button class="nav" data-v="citas">${ico('cal')}Citas</button>
    <button class="nav" data-v="miembros">${ico('users')}Miembros</button>
    <button class="nav" data-v="numero">${ico('phone')}Número</button>
    <button class="nav" id="nav-chats">${ico('chat')}Abrir chats</button>
    <div class="sp"></div>
    <div class="foot"><span id="ft-user"></span> · <a href="#" id="salir">Salir</a></div>
  </aside>
  <header class="topbar"><b id="tb-marca">Panel</b><span class="sp"></span><button class="x" id="tb-chats">Chats</button><button class="x" id="tb-salir">Salir</button></header>
  <main class="main" id="main"></main>
  <nav class="tabs" id="tabs">
    <button class="on" data-v="inicio">${ico('home')}Inicio</button><button data-v="autos">${ico('car')}Autos</button><button data-v="citas">${ico('cal')}Citas</button><button data-v="miembros">${ico('users')}Miembros</button><button data-v="numero">${ico('phone')}Número</button>
  </nav>
</div>
<script>
const API = '/api/seb-panel';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICO = { home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>', car: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 16l1.5-5h11L19 16M5 16h14v3H5zM7 19v2M17 19v2"/><circle cx="8" cy="16" r="1"/><circle cx="16" cy="16" r="1"/></svg>', cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>', users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-5-6.3"/></svg>', phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>', chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H8l-4 4z"/></svg>' };
document.body.innerHTML = document.body.innerHTML.replace(/\$\{ico\('(\w+)'\)\}/g, (m, k) => ICO[k] || '');
const post = (action, body) => fetch(API + '?action=' + action, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }).then(r => r.json()).catch(() => ({ ok: false, error: 'Sin conexión' }));
const get = (action, q) => fetch(API + '?action=' + action + (q ? '&' + new URLSearchParams(q) : '')).then(r => r.json()).catch(() => ({ ok: false, error: 'Sin conexión' }));
let SES = null, INFO = null, AUTOS = [], VISTA = 'inicio', MES = null;
const fmtDinero = n => n == null ? '' : '$' + Number(n).toLocaleString('es-MX');
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'], MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const TZ = 6 * 3600000; const dMx = ts => new Date(Number(ts) - TZ); const ymd = ts => dMx(ts).toISOString().slice(0, 10);
const hm = ts => { const d = dMx(ts); const h = d.getUTCHours(), m = d.getUTCMinutes(); return (h % 12 || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? ' am' : ' pm'); };
const telFmt = t => { const d = String(t || '').replace(/\D/g, '').slice(-10); return d ? d.replace(/(\d{2})(\d{4})(\d{4})/, '$1 $2 $3') : ''; };
// ── marca antes de entrar (por ?vendedor= o por sesión) ──
(async () => {
  const v = new URLSearchParams(location.search).get('vendedor');
  if (v) { const r = await get('tenant_marca', { vendedor: v }); if (r.ok) { const m = r.marca || r.nombre; $('lg-marca').textContent = m; document.title = m; } }
  const yo = await get('acceso_yo'); if (yo.ok && yo.sesion && yo.sesion.tenant && Number(yo.sesion.tenant.id)) { SES = yo.sesion; await entrar(); }
})();
$('lg-go').onclick = async () => {
  const b = $('lg-go'); b.disabled = true; $('lg-err').textContent = '';
  try { const r = await post('acceso_entrar_usuario', { usuario: $('lg-u').value, contrasena: $('lg-p').value }); if (!r.ok) { $('lg-err').textContent = r.error || 'No se pudo entrar'; return; } SES = { tenant: r.tenant }; await entrar(); }
  finally { b.disabled = false; }
};
$('lg-p').addEventListener('keydown', e => { if (e.key === 'Enter') $('lg-go').click(); });
$('salir').onclick = async e => { e.preventDefault(); await post('acceso_salir', {}); location.reload(); };
async function entrar(){
  const r = await get('panel_info', { vendedor: String(SES.tenant.id) }); if (!r.ok) { $('lg-err').textContent = r.error || 'No se pudo cargar el panel'; return; }
  INFO = r; const a = await get('autos_mios', { vendedor: String(SES.tenant.id) }); AUTOS = (a.ok && a.autos) || [];
  const m = INFO.tenant.marca || INFO.tenant.nombre; document.title = m; $('sd-marca').firstChild.textContent = m; $('sd-nombre').textContent = INFO.tenant.nombre; $('ft-user').textContent = INFO.tenant.usuario || '';
  $('nav-chats').onclick = $('tb-chats').onclick = () => { location.href = '/fyrachat.html?vendedor=' + INFO.tenant.id; }; $('tb-marca').textContent = m; $('tb-salir').onclick = () => $('salir').click();
  $('login').style.display = 'none'; $('app').classList.add('on'); MES = null; ir('inicio');
}
document.querySelectorAll('.nav[data-v],.tabs button[data-v]').forEach(b => b.onclick = () => ir(b.dataset.v));
function ir(v){ VISTA = v; document.querySelectorAll('.nav[data-v],.tabs button[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); pintar(); window.scrollTo(0, 0); }
function pintar(){
  const M = $('main'); const t = INFO.tenant; const vivas = INFO.citas.filter(c => ['viva', 'en_camino', 'pospuesta'].includes(c.estado));
  if (VISTA === 'inicio') {
    M.innerHTML = '<h2>' + esc(t.marca || t.nombre) + '</h2><p class="sub">' + esc(t.nombre) + '</p>' +
      '<div class="grid"><div class="kpi"><b>' + AUTOS.length + '</b><span>autos activos</span></div><div class="kpi"><b>' + vivas.length + '</b><span>citas vivas</span></div><div class="kpi"><b>' + INFO.chats_delegados + '</b><span>chats en seguimiento</span></div><div class="kpi"><b>' + INFO.miembros.filter(m => m.activo).length + '</b><span>miembros</span></div></div>' +
      '<div class="lista">' + (vivas.slice(0, 6).map(c => '<div class="item"><div class="ava">' + esc((c.nombre || '?').slice(0, 1).toUpperCase()) + '</div><div><div class="t">' + esc(c.nombre || 'Sin nombre') + ' · ' + esc(c.auto || '') + '</div><div class="s">' + esc(c.cuando || '') + (c.proxima ? ' · sigue: ' + esc(c.proxima.cuando || '') : '') + '</div></div><div class="sp"></div>' + tagEstado(c.estado) + '</div>').join('') || '<div class="vacio">Sin citas vivas por ahora.</div>') + '</div>';
  } else if (VISTA === 'autos') {
    M.innerHTML = '<h2>Autos</h2><p class="sub">' + AUTOS.length + ' en este universo</p><div class="grid">' + (AUTOS.map(a => '<div class="card auto">' + (a.portada ? '<img src="' + esc(a.portada) + '" alt="">' : '<div class="ph"></div>') + '<div><div class="t">' + esc(a.nombre) + '</div><div class="s">' + fmtDinero(a.precio) + (a.km ? ' · ' + Number(a.km).toLocaleString('es-MX') + ' km' : '') + '</div>' + (a.estado && a.estado !== 'activo' ? '<span class="tag">' + esc(a.estado) + '</span>' : '') + '</div></div>').join('') || '<div class="vacio">Sin autos.</div>') + '</div>';
  } else if (VISTA === 'citas') pintarCitas();
  else if (VISTA === 'miembros') {
    M.innerHTML = '<h2>Miembros</h2><p class="sub">Vendedores que usan este panel y atienden los chats del mismo número.</p><div class="lista">' + (INFO.miembros.map(m => '<div class="item"><div class="ava">' + esc((m.nombre || '?').slice(0, 1).toUpperCase()) + '</div><div><div class="t">' + esc(m.nombre) + '</div><div class="s">+52 ' + esc(telFmt(m.telefono)) + '</div></div><div class="sp"></div>' + (m.activo ? '<span class="tag ok">Activo</span>' : '<span class="tag warn">Pendiente de código</span>') + ' <button class="x" data-q="' + m.id + '">Quitar</button></div>').join('') || '<div class="vacio">Todavía no hay miembros.</div>') + '</div>' +
      '<div class="form"><h3>Agregar miembro</h3><p>Escribe su nombre y su WhatsApp; le llega un código y con ese código queda dado de alta.</p><div class="row2"><div><label class="lbl">Nombre</label><input class="inp" id="mb-n"></div><div><label class="lbl">WhatsApp (10 dígitos)</label><input class="inp" id="mb-t" inputmode="numeric" maxlength="12"></div></div><div class="err" id="mb-e"></div><button class="btn" id="mb-go" style="margin-top:8px">Enviar código</button><div id="mb-cod" style="display:none"><label class="lbl">Código que le llegó</label><input class="inp" id="mb-c" inputmode="numeric" maxlength="6"><div class="err" id="mb-e2"></div><button class="btn" id="mb-ok" style="margin-top:8px">Dar de alta</button></div></div>';
    M.querySelectorAll('button[data-q]').forEach(b => b.onclick = async () => { if (!confirm('¿Quitar a este miembro?')) return; await post('miembro_quitar', { id: Number(b.dataset.q), vendedor: String(t.id) }); await recargar(); });
    $('mb-go').onclick = async () => { const b = $('mb-go'); b.disabled = true; $('mb-e').textContent = ''; try { const r = await post('miembro_agregar', { nombre: $('mb-n').value, telefono: $('mb-t').value, vendedor: String(t.id) }); if (!r.ok) { $('mb-e').textContent = r.error || 'No se pudo'; return; } $('mb-cod').style.display = ''; $('mb-e').textContent = r.enviado ? 'Código enviado por WhatsApp.' : (r.codigo_prueba ? 'Modo prueba: el código es ' + r.codigo_prueba : 'No se pudo mandar el código por WhatsApp.'); $('mb-e').style.color = 'var(--txt2)'; } finally { b.disabled = false; } };
    $('mb-ok').onclick = async () => { const b = $('mb-ok'); b.disabled = true; $('mb-e2').textContent = ''; try { const r = await post('miembro_confirmar', { telefono: $('mb-t').value, codigo: $('mb-c').value, vendedor: String(t.id) }); if (!r.ok) { $('mb-e2').textContent = r.error || 'No se pudo'; return; } await recargar(); } finally { b.disabled = false; } };
  } else if (VISTA === 'numero') {
    M.innerHTML = '<h2>Número</h2><p class="sub">El WhatsApp con el que opera ' + esc(t.marca || t.nombre) + '.</p><div class="card">' + (t.telefono ? '<div class="auto"><div class="ava" style="width:44px;height:44px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center">' + ICO.phone + '</div><div><div class="t">+52 ' + esc(telFmt(t.telefono)) + '</div><div class="s">Vinculado al asistente</div></div></div>' : '<div class="vacio">Todavía no hay número asignado. Cuando lo tengas se vincula aquí.</div>') + '</div>' + (t.horario ? '<div class="card" style="margin-top:12px"><div class="t" style="font-weight:600;margin-bottom:6px">Horario</div>' + horarioTxt(t.horario) + '</div>' : '');
  }
}
function tagEstado(e){ return { viva: '<span class="tag ok">Viva</span>', en_camino: '<span class="tag ok">En camino</span>', pospuesta: '<span class="tag warn">Sin fecha</span>', realizada: '<span class="tag off">Realizada</span>', cancelada: '<span class="tag off">Cancelada</span>', no_llego: '<span class="tag off">No llegó</span>' }[e] || '<span class="tag">' + esc(e) + '</span>'; }
function horarioTxt(h){ const nd = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb']; return [1, 2, 3, 4, 5, 6, 0].map(d => { const r = h[String(d)] || h[d]; return '<div class="s" style="display:flex;gap:10px"><span style="width:36px;color:var(--muted)">' + nd[d] + '</span>' + (Array.isArray(r) ? esc(hm(Date.UTC(2026, 0, 4, r[0]) + TZ) + ' – ' + hm(Date.UTC(2026, 0, 4, r[1]) + TZ)) : 'cerrado') + '</div>'; }).join(''); }
function pintarCitas(){
  const M = $('main'); const hoy = new Date(Date.now() - TZ); if (!MES) MES = { y: hoy.getUTCFullYear(), m: hoy.getUTCMonth() };
  const first = new Date(Date.UTC(MES.y, MES.m, 1)); const start = new Date(first); start.setUTCDate(1 - first.getUTCDay());
  const porDia = {}; INFO.citas.forEach(c => { if (!c.ini_ts || c.estado === 'pospuesta') return; const ds = (c.dias && c.dias.length) ? c.dias : [ymd(c.ini_ts)]; ds.forEach(k => { (porDia[k] = porDia[k] || []).push(c); }); });
  let cells = ''; for (let i = 0; i < 42; i++) { const d = new Date(start.getTime() + i * 86400000); const k = d.toISOString().slice(0, 10); const out = d.getUTCMonth() !== MES.m; const esHoy = k === hoy.toISOString().slice(0, 10);
    cells += '<div class="d' + (out ? ' out' : '') + (esHoy ? ' hoy' : '') + '"><div class="n">' + d.getUTCDate() + '</div>' + (porDia[k] || []).map(c => '<span class="ev' + (['realizada', 'cancelada', 'no_llego'].includes(c.estado) ? ' fin' : (c.estado === 'en_camino' ? ' camino' : '')) + '" title="' + esc((c.nombre || '') + ' · ' + (c.auto || '')) + '">' + esc(((c.precision === 'hora' || c.precision === 'franja') && c.hora ? c.hora + ' ' : '') + (c.nombre || 'Sin nombre')) + '</span>').join('') + '</div>'; }
  const vivas = INFO.citas.filter(c => ['viva', 'en_camino', 'pospuesta'].includes(c.estado)).sort((a, b) => (a.ini_ts || 0) - (b.ini_ts || 0));
  M.innerHTML = '<h2>Citas</h2><p class="sub">Todas las citas agendadas.</p><div class="calh"><button id="c-prev">‹</button><b>' + MESES[MES.m] + ' ' + MES.y + '</b><button id="c-next">›</button></div><div class="cal">' + ['D', 'L', 'M', 'M', 'J', 'V', 'S'].map(x => '<div class="dn">' + x + '</div>').join('') + cells + '</div>' +
    '<div class="lista">' + (vivas.map(c => '<div class="item"><div class="ava">' + esc((c.nombre || '?').slice(0, 1).toUpperCase()) + '</div><div><div class="t">' + esc(c.nombre || 'Sin nombre') + ' · ' + esc(c.auto || '') + '</div><div class="s">' + esc(c.situacion || c.cuando || '') + '</div></div><div class="sp"></div>' + tagEstado(c.estado) + '</div>').join('') || '<div class="vacio">Sin citas vivas.</div>') + '</div>';
  $('c-prev').onclick = () => { MES.m--; if (MES.m < 0) { MES.m = 11; MES.y--; } pintarCitas(); }; $('c-next').onclick = () => { MES.m++; if (MES.m > 11) { MES.m = 0; MES.y++; } pintarCitas(); };
}
async function recargar(){ const r = await get('panel_info', { vendedor: String(INFO.tenant.id) }); if (r.ok) { INFO = r; pintar(); } }
</script>
