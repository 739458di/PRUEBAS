<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--side:#FAFAFA;--s1:#F4F4F5;--ln:#E5E7EB;--ln2:#EEF0F3;--txt:#111827;--txt2:#6B7280;--mut:#9CA3AF;--ok:#16A34A;--okbg:#ECFDF3;--warn:#B45309;--warnbg:#FEF3C7;--off:#6B7280;--offbg:#F3F4F6;--acc:#111827;--r:10px;--f:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--f);color:var(--txt);background:var(--bg);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
.ic{width:16px;height:16px;flex:0 0 16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--side)}
.login .card{width:100%;max-width:400px;background:#fff;border:1px solid var(--ln);border-radius:14px;padding:28px}
.login h1{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}.login p{color:var(--txt2);margin:0 0 20px}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--txt2);margin:12px 0 6px}
.inp{width:100%;height:40px;border:1px solid var(--ln);border-radius:8px;padding:0 12px;font:inherit;color:var(--txt);background:#fff;outline:none}.inp:focus{border-color:#9CA3AF;box-shadow:0 0 0 3px rgba(17,24,39,.06)}
.btn{height:40px;border:1px solid var(--acc);border-radius:8px;background:var(--acc);color:#fff;font:600 14px var(--f);padding:0 16px}.btn[disabled]{opacity:.5}.btn.w{width:100%;margin-top:16px}
.btn.sec{background:#fff;color:var(--txt);border-color:var(--ln)}.btn.sec:hover{background:var(--s1)}
.err{color:#DC2626;font-size:13px;min-height:18px;margin-top:8px}
/* app shell */
.app{display:none}.app.on{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--ln);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;font-weight:600;font-size:15px}
.brand .mk{width:26px;height:26px;border-radius:7px;background:#111827;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.brand .tag{font-size:10px;font-weight:600;color:var(--txt2);background:var(--s1);border:1px solid var(--ln);border-radius:5px;padding:1px 6px;letter-spacing:.04em}
.snav{padding:6px 12px;display:flex;flex-direction:column;gap:2px}
.grp{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--txt2);text-transform:uppercase;padding:14px 10px 4px;display:flex;align-items:center;justify-content:space-between}.grp .ic{width:14px;height:14px;color:var(--mut)}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--txt);border:0;background:none;text-align:left;font-size:14px;width:100%}
.nav .ic{color:var(--txt2)}.nav:hover{background:#F0F0F1}.nav.on{background:#EDEEF0;font-weight:600}.nav .n{margin-left:auto;font-size:11px;background:#fff;border:1px solid var(--ln);border-radius:999px;padding:0 7px;color:var(--txt2)}
.side .sp{flex:1}
.sfoot{border-top:1px solid var(--ln);padding:12px;display:flex;align-items:center;gap:10px}
.sfoot .av{width:34px;height:34px;border-radius:8px;border:1px solid var(--ln);background:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--txt2)}
.sfoot .t{font-weight:600;font-size:13px;line-height:16px}.sfoot .s{font-size:12px;color:var(--txt2);line-height:16px}
.sfoot button{margin-left:auto;border:0;background:none;color:var(--txt2);font-size:12px;font-weight:600;padding:6px 8px;border-radius:6px}.sfoot button:hover{background:var(--s1);color:var(--txt)}
/* main */
.main{padding:28px 36px 60px;min-width:0}
.topbar{display:none}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0 0 18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin:0 0 24px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;font-size:14px;color:var(--txt2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}.tab.on{color:var(--txt);font-weight:600;border-bottom-color:var(--txt)}
h2{font-size:17px;font-weight:600;margin:0 0 6px}
.desc{color:var(--txt2);max-width:640px;margin:0 0 18px}
.tools{display:flex;gap:10px;margin-bottom:12px}
.search{flex:1;display:flex;align-items:center;gap:8px;height:40px;border:1px solid var(--ln);border-radius:8px;padding:0 12px;background:#fff}.search input{border:0;outline:0;flex:1;font:inherit;color:var(--txt);background:none;min-width:0}.search .ic{color:var(--mut)}
.sel{height:40px;border:1px solid var(--ln);border-radius:8px;background:#fff;padding:0 12px;font:inherit;color:var(--txt);display:flex;align-items:center;gap:8px}
.count{font-size:13px;color:var(--txt2);margin:0 0 14px}.count b{color:var(--txt);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cd{border:1px solid var(--ln);border-radius:var(--r);background:#fff;padding:14px;display:flex;gap:12px;align-items:flex-start;min-height:96px}
.cd .lg{width:44px;height:44px;border-radius:8px;background:var(--s1);border:1px solid var(--ln2);display:grid;place-items:center;overflow:hidden;flex:0 0 44px;font-weight:700;color:var(--txt2);font-size:13px}.cd .lg img{width:100%;height:100%;object-fit:cover}
.cd .bd{flex:1;min-width:0}.cd .t{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.cd .s{color:var(--txt2);font-size:13px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.pill.ok{color:var(--ok);background:var(--okbg)}.pill.warn{color:var(--warn);background:var(--warnbg)}.pill.off{color:var(--off);background:var(--offbg)}
.ib{width:32px;height:32px;border:1px solid var(--ln);border-radius:8px;background:#fff;display:grid;place-items:center;color:var(--txt2);flex:0 0 32px}.ib:hover{background:var(--s1);color:var(--txt)}
.vacio{color:var(--txt2);padding:28px;border:1px dashed var(--ln);border-radius:var(--r);text-align:center}
/* calendario */
.calh{display:flex;align-items:center;gap:8px;margin:0 0 10px}.calh b{font-size:15px;flex:1;font-weight:600}.calh .ib{width:34px;height:34px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;background:var(--ln)}.cal>div{background:#fff;min-width:0}
.cal .dn{font-size:11px;font-weight:600;color:var(--txt2);text-align:center;padding:8px 0;background:var(--side)}
.cal .d{min-height:86px;padding:6px;font-size:12px}.cal .d.out{background:#FCFCFC;color:var(--mut)}.cal .d .n{font-weight:600;margin-bottom:4px;width:22px;height:22px;display:grid;place-items:center;border-radius:6px}.cal .d.hoy .n{background:var(--txt);color:#fff}
.cal .ev{display:block;font-size:11px;line-height:15px;padding:2px 6px;border-radius:5px;background:#EEF2FF;color:#3730A3;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid #4F46E5}
.cal .ev.fin{background:var(--offbg);color:var(--off);border-left-color:#9CA3AF}.cal .ev.camino{background:var(--okbg);color:#166534;border-left-color:var(--ok)}
/* formulario agregar */
.panel{border:1px solid var(--ln);border-radius:var(--r);padding:18px;margin-top:22px;background:#fff;max-width:760px}
.panel h3{margin:0 0 4px;font-size:15px}.panel p{margin:0 0 6px;color:var(--txt2);font-size:13px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--txt2);margin-top:10px;min-height:18px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:13px}.kv span{color:var(--txt2)}
@media (max-width:820px){
  .app.on{grid-template-columns:1fr}.side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:#fff;z-index:3}
  .topbar .brand{padding:0;flex:1}.topbar .av{width:32px;height:32px;border-radius:8px;border:1px solid var(--ln);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--txt2)}
  .topbar .x{border:1px solid var(--ln);background:#fff;border-radius:8px;height:32px;padding:0 10px;font:600 12px var(--f);color:var(--txt)}
  .main{padding:18px 16px 40px}h1{font-size:20px;margin-bottom:12px}
  .tools{flex-wrap:wrap}.sel{display:none}.grid{grid-template-columns:1fr}.row3{grid-template-columns:1fr}
  .cal .d{min-height:62px;padding:3px}.cal .d .n{width:20px;height:20px}.cal .ev{font-size:9px;line-height:13px;padding:1px 3px}
}
</style>
</head>
<body>
<div class="login" id="login">
  <div class="card">
    <h1 id="lg-marca">Panel</h1><p>Inicia sesión con tu usuario y contraseña.</p>
    <label class="lbl" for="lg-u">Usuario</label><input class="inp" id="lg-u" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="tu usuario">
    <label class="lbl" for="lg-p">Contraseña</label><input class="inp" id="lg-p" type="password" autocomplete="current-password" placeholder="••••••••">
    <div class="err" id="lg-err"></div>
    <button class="btn w" id="lg-go">Entrar</button>
  </div>
</div>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><span class="mk" id="sd-mk">T</span><span id="sd-marca">Panel</span><span class="tag">LOTE</span></div>
    <nav class="snav">
      <button class="nav" data-v="general">{{home}}Inicio</button>
      <div class="grp">FyraChat {{chev}}</div>
      <div id="sd-fc"></div>
      <div class="grp">Operación {{chev}}</div>
      <button class="nav" data-v="autos">{{car}}Autos<span class="n" id="n-autos"></span></button>
      <button class="nav" data-v="citas">{{cal}}Citas<span class="n" id="n-citas"></span></button>
      <div class="grp">Organización {{chev}}</div>
      <button class="nav" data-v="miembros">{{users}}Miembros<span class="n" id="n-miembros"></span></button>
      <button class="nav" data-v="numero">{{phone}}Número</button>
    </nav>
    <div class="sp"></div>
    <div class="sfoot"><div class="av" id="sd-av">TE</div><div><div class="t" id="sd-nombre"></div><div class="s" id="sd-user"></div></div><button id="salir">Salir</button></div>
  </aside>
  <div>
    <header class="topbar"><div class="brand"><span class="mk" id="tb-mk">T</span><span id="tb-marca">Panel</span></div><button class="x" data-v="fyrachat">FyraChat</button><button class="x" id="tb-salir">Salir</button></header>
    <main class="main">
      <h1 id="titulo">Configuración</h1>
      <div class="tabs" id="tabs">
        <button class="tab" data-v="general">General</button><button class="tab" data-v="fyrachat">FyraChat</button><button class="tab" data-v="autos">Autos</button><button class="tab" data-v="citas">Citas</button><button class="tab" data-v="miembros">Miembros</button><button class="tab" data-v="numero">Número</button>
      </div>
      <div id="main"></div>
    </main>
  </div>
</div>
<script>
const API = '/api/seb-panel';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const I = { home: '<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>', car: '<path d="M5 16l1.5-5h11L19 16M5 16h14v3H5zM7 19v2M17 19v2"/><circle cx="8" cy="16" r="1"/><circle cx="16" cy="16" r="1"/>', cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-5-6.3"/>', phone: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>', chat: '<path d="M4 5h16v11H8l-4 4z"/>', chev: '<path d="m6 9 6 6 6-6"/>', search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', ext: '<path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>', l: '<path d="m15 18-6-6 6-6"/>', r: '<path d="m9 18 6-6-6-6"/>', plus: '<path d="M12 5v14M5 12h14"/>' };
const ico = n => '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + (I[n] || '') + '</svg>';
document.body.innerHTML = document.body.innerHTML.replace(/\{\{(\w+)\}\}/g, (m, k) => ico(k));
const post = (action, body) => fetch(API + '?action=' + action, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }).then(r => r.json()).catch(() => ({ ok: false, error: 'Sin conexión' }));
const get = (action, q) => fetch(API + '?action=' + action + (q ? '&' + new URLSearchParams(q) : '')).then(r => r.json()).catch(() => ({ ok: false, error: 'Sin conexión' }));
let SES = null, INFO = null, AUTOS = [], VISTA = 'general', MES = null, Q = '';
const fmtDinero = n => n == null ? '' : '$' + Number(n).toLocaleString('es-MX');
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const TZ = 6 * 3600000; const dMx = ts => new Date(Number(ts) - TZ); const ymd = ts => dMx(ts).toISOString().slice(0, 10);
const hm = h => (h % 12 || 12) + (h < 12 ? ' am' : ' pm');
const telFmt = t => { const d = String(t || '').replace(/\D/g, '').slice(-10); return d ? d.replace(/(\d{2})(\d{4})(\d{4})/, '$1 $2 $3') : ''; };
const ini = s => String(s || '?').split(/\s+/).slice(0, 2).map(x => x[0] || '').join('').toUpperCase();
const VIVAS = ['viva', 'en_camino', 'pospuesta'];
(async () => {
  const v = new URLSearchParams(location.search).get('vendedor');
  if (v) { const r = await get('tenant_marca', { vendedor: v }); if (r.ok) { const m = r.marca || r.nombre; $('lg-marca').textContent = m; document.title = m; } }
  const yo = await get('acceso_yo'); if (yo.ok && yo.sesion && yo.sesion.tenant && (Number(yo.sesion.tenant.id) || (yo.sesion.maestra && v))) { SES = yo.sesion; await entrar(); }   // la maestra (Sales Brain) entra con ?vendedor=ID
})();
$('lg-go').onclick = async () => {
  const b = $('lg-go'); b.disabled = true; $('lg-err').textContent = '';
  try { const r = await post('acceso_entrar_usuario', { usuario: $('lg-u').value, contrasena: $('lg-p').value }); if (!r.ok) { $('lg-err').textContent = r.error || 'No se pudo entrar'; return; } SES = { tenant: r.tenant }; await entrar(); }
  finally { b.disabled = false; }
};
$('lg-p').addEventListener('keydown', e => { if (e.key === 'Enter') $('lg-go').click(); });
const salir = async () => { await post('acceso_salir', {}); location.reload(); };
$('salir').onclick = salir; $('tb-salir').onclick = salir;
let TID = 0;
async function entrar(){
  TID = Number(new URLSearchParams(location.search).get('vendedor')) || Number(SES.tenant.id);
  const r = await get('panel_info', { vendedor: String(TID) }); if (!r.ok) { $('lg-err').textContent = r.error || 'No se pudo cargar el panel'; return; }
  INFO = r; const a = await get('autos_mios', { vendedor: String(TID) }); AUTOS = (a.ok && a.autos) || [];
  const t = INFO.tenant, m = t.marca || t.nombre; document.title = m;
  $('sd-marca').textContent = m; $('tb-marca').textContent = m; $('sd-mk').textContent = m[0]; $('tb-mk').textContent = m[0];
  $('sd-nombre').textContent = t.nombre; $('sd-user').textContent = t.usuario || ''; $('sd-av').textContent = ini(t.nombre);
  $('titulo').textContent = 'Configuración de ' + m;
  pintarSideFC();
  $('login').style.display = 'none'; $('app').classList.add('on'); MES = null; ir('general');
}
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => ir(b.dataset.v));
function ir(v){ VISTA = v; Q = ''; document.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); contar(); pintar(); window.scrollTo(0, 0); }
// FyraChat por vendedor: el lote (TERRA) + cada miembro activo. Todos comparten el número del lote; el de un miembro abre sus chats.
function fcLista(){ const t = INFO.tenant; const out = [{ id: 0, nombre: t.marca || t.nombre, sub: t.telefono ? '+52 ' + telFmt(t.telefono) : 'Sin número todavía', tel: t.telefono, lote: true, href: '/fyrachat.html?vendedor=' + t.id }]; INFO.miembros.filter(m => m.activo).forEach(m => out.push({ id: m.id, nombre: m.nombre, sub: '+52 ' + telFmt(m.telefono), tel: m.telefono, lote: false, href: '/fyrachat.html?vendedor=' + t.id + '&miembro=' + m.id })); return out; }
function pintarSideFC(){ $('sd-fc').innerHTML = fcLista().map(f => '<a class="nav" href="' + f.href + '">' + ico('chat') + esc(f.nombre) + (f.lote ? '<span class="n">lote</span>' : '') + '</a>').join(''); }
function contar(){ $('n-autos').textContent = AUTOS.length || ''; $('n-citas').textContent = INFO.citas.filter(c => VIVAS.includes(c.estado)).length || ''; $('n-miembros').textContent = INFO.miembros.length || ''; }
function pillEstado(e){ return { viva: '<span class="pill ok"><i></i>Viva</span>', en_camino: '<span class="pill ok"><i></i>En camino</span>', pospuesta: '<span class="pill warn"><i></i>Sin fecha</span>', realizada: '<span class="pill off"><i></i>Realizada</span>', cancelada: '<span class="pill off"><i></i>Cancelada</span>', no_llego: '<span class="pill off"><i></i>No llegó</span>' }[e] || '<span class="pill off">' + esc(e) + '</span>'; }
const tools = (ph, extra) => '<div class="tools"><label class="search">' + ico('search') + '<input id="q" placeholder="' + esc(ph) + '" value="' + esc(Q) + '"></label>' + (extra || '') + '</div>';
function bindQ(){ const q = $('q'); if (q) { q.oninput = () => { Q = q.value; pintar(true); }; } }
function pintar(keep){
  const M = $('main'); const t = INFO.tenant; const qn = Q.trim().toLowerCase(); const hit = s => !qn || String(s || '').toLowerCase().includes(qn);
  const vivas = INFO.citas.filter(c => VIVAS.includes(c.estado));
  if (VISTA === 'general') {
    M.innerHTML = '<h2>Resumen de ' + esc(t.marca || t.nombre) + '</h2><p class="desc">Lo que está pasando hoy en tu lote: autos publicados, citas agendadas y las personas que atienden los chats.</p>' +
      '<div class="grid">' + [[AUTOS.length, 'autos activos', 'autos'], [vivas.length, 'citas vivas', 'citas'], [INFO.chats_delegados, 'chats en seguimiento', null], [INFO.miembros.filter(m => m.activo).length, 'miembros activos', 'miembros']].map(k => '<div class="cd"><div class="bd"><div class="t" style="font-size:24px;letter-spacing:-.02em">' + k[0] + '</div><div class="s">' + k[1] + '</div></div>' + (k[2] ? '<button class="ib" data-go="' + k[2] + '">' + ico('r') + '</button>' : '') + '</div>').join('') + '</div>' +
      '<h2 style="margin-top:26px">FyraChat</h2><p class="desc">El chat de cada vendedor del lote.</p><div class="grid">' + fcLista().map(f => '<div class="cd"><div class="lg">' + esc(ini(f.nombre)) + '</div><div class="bd"><div class="t">' + esc(f.nombre) + '</div><div class="s">' + esc(f.sub) + '</div></div><a class="ib" href="' + f.href + '" title="Abrir FyraChat">' + ico('r') + '</a></div>').join('') + '</div>' + '<h2 style="margin-top:26px">Próximas citas</h2><p class="desc">Las citas vivas más cercanas.</p><div class="grid">' + (vivas.slice(0, 6).map(citaCard).join('') || '<div class="vacio">Sin citas vivas por ahora.</div>') + '</div>';
    M.querySelectorAll('[data-go]').forEach(b => b.onclick = () => ir(b.dataset.go));
  } else if (VISTA === 'fyrachat') {
    const L = fcLista();
    M.innerHTML = '<h2>FyraChat de cada vendedor</h2><p class="desc">Cada vendedor del lote tiene su FyraChat. Todos atienden desde el mismo WhatsApp de ' + esc(t.marca || t.nombre) + '; el asistente contesta y, cuando escala, el chat le llega al vendedor que lo lleva.</p>' +
      '<p class="count"><b>' + L.length + '</b> FyraChat' + (L.length === 1 ? '' : 's') + (t.telefono ? '' : ' · el lote todavía no tiene número') + '</p><div class="grid">' + L.map(f => '<div class="cd"><div class="lg">' + esc(ini(f.nombre)) + '</div><div class="bd"><div class="t">' + esc(f.nombre) + (f.lote ? (f.tel ? '<span class="pill ok"><i></i>Lote</span>' : '<span class="pill off"><i></i>Sin número</span>') : '<span class="pill ok"><i></i>Vendedor</span>') + '</div><div class="s">' + esc(f.sub) + '</div><div class="acts" style="margin-top:10px"><a class="btn sec" style="display:inline-flex;align-items:center;height:34px" href="' + f.href + '">Abrir FyraChat</a></div></div></div>').join('') + '</div>' +
      (INFO.miembros.filter(m => m.activo).length ? '' : '<p class="hint">Cuando des de alta miembros, aquí aparece el FyraChat de cada uno.</p>');
  } else if (VISTA === 'autos') {
    const sel = AUTOS.filter(a => hit(a.nombre));
    M.innerHTML = '<h2>Autos del lote</h2><p class="desc">Los autos que el asistente conoce y ofrece en los chats. Cada tarjeta abre la ficha del auto.</p>' + tools('Buscar auto…', '<button class="sel">Todos ' + ico('chev') + '</button>') +
      '<p class="count"><b>' + sel.length + '</b> autos' + (qn ? ' encontrados' : ' activos') + '</p><div class="grid">' + (sel.map(a => '<div class="cd"><div class="lg">' + (a.portada ? '<img src="' + esc(a.portada) + '" alt="">' : esc((a.marca || '?')[0])) + '</div><div class="bd"><div class="t">' + esc(a.nombre) + (a.estado === 'activo' ? '<span class="pill ok"><i></i>Disponible</span>' : '<span class="pill warn"><i></i>' + esc(a.estado) + '</span>') + '</div><div class="s">' + fmtDinero(a.precio) + (a.km ? ' · ' + Number(a.km).toLocaleString('es-MX') + ' km' : '') + (a.fotos ? ' · ' + a.fotos + ' fotos' : '') + '</div></div>' + (a.web_id ? '<a class="ib" href="https://www.fyradrive.com/car/' + a.web_id + '" target="_blank" rel="noopener" title="Ver ficha">' + ico('ext') + '</a>' : '') + '</div>').join('') || '<div class="vacio">Sin autos.</div>') + '</div>';
    bindQ();
  } else if (VISTA === 'citas') pintarCitas(keep);
  else if (VISTA === 'miembros') {
    const sel = INFO.miembros.filter(m => hit(m.nombre + ' ' + m.telefono));
    M.innerHTML = '<h2>Miembros</h2><p class="desc">Vendedores de ' + esc(t.marca || t.nombre) + '. Todos atienden desde el mismo WhatsApp del lote; cuando el asistente escala un chat, le avisa a la persona que lo lleva.</p>' + tools('Buscar miembro…') +
      '<p class="count"><b>' + INFO.miembros.filter(m => m.activo).length + '</b> activos · <b>' + INFO.miembros.filter(m => !m.activo).length + '</b> pendientes de código</p><div class="grid">' + (sel.map(m => '<div class="cd"><div class="lg">' + esc(ini(m.nombre)) + '</div><div class="bd"><div class="t">' + esc(m.nombre) + (m.activo ? '<span class="pill ok"><i></i>Activo</span>' : '<span class="pill warn"><i></i>Pendiente</span>') + '</div><div class="s">+52 ' + esc(telFmt(m.telefono)) + '</div></div><button class="ib" data-q="' + m.id + '" title="Quitar">' + ico('x') + '</button></div>').join('') || '<div class="vacio">Todavía no hay miembros. Agrega al primero aquí abajo.</div>') + '</div>' +
      '<div class="panel"><h3>Agregar miembro</h3><p>Escribe su nombre y su WhatsApp y mándale el código. Cuando te lo pase, escríbelo y dale de alta.</p><div class="row3"><div><label class="lbl">Nombre</label><input class="inp" id="mb-n" placeholder="Nombre del vendedor"></div><div><label class="lbl">WhatsApp</label><input class="inp" id="mb-t" inputmode="numeric" maxlength="12" placeholder="10 dígitos"></div><div><label class="lbl">Código que le llegó</label><input class="inp" id="mb-c" inputmode="numeric" maxlength="6" placeholder="6 dígitos"></div></div><div class="acts"><button class="btn sec" id="mb-go">Enviar código</button><button class="btn" id="mb-ok">Dar de alta</button></div><div class="hint" id="mb-h"></div></div>';
    bindQ();
    M.querySelectorAll('button[data-q]').forEach(b => b.onclick = async () => { if (!confirm('¿Quitar a este miembro?')) return; await post('miembro_quitar', { id: Number(b.dataset.q), vendedor: String(t.id) }); await recargar(); });
    $('mb-go').onclick = async () => { const b = $('mb-go'); b.disabled = true; const h = $('mb-h'); h.textContent = ''; try { const r = await post('miembro_agregar', { nombre: $('mb-n').value, telefono: $('mb-t').value, vendedor: String(t.id) }); if (!r.ok) { h.textContent = r.error || 'No se pudo'; h.style.color = '#DC2626'; return; } h.style.color = ''; h.textContent = r.enviado ? 'Código enviado por WhatsApp. Escríbelo y dale de alta.' : (r.codigo_prueba ? 'Modo prueba: el código es ' + r.codigo_prueba : 'No se pudo mandar el código por WhatsApp.'); $('mb-c').focus(); } finally { b.disabled = false; } };
    $('mb-ok').onclick = async () => { const b = $('mb-ok'); b.disabled = true; const h = $('mb-h'); try { const r = await post('miembro_confirmar', { telefono: $('mb-t').value, codigo: $('mb-c').value, vendedor: String(t.id) }); if (!r.ok) { h.textContent = r.error || 'No se pudo'; h.style.color = '#DC2626'; return; } await recargar(); } finally { b.disabled = false; } };
  } else if (VISTA === 'numero') {
    M.innerHTML = '<h2>Número de ' + esc(t.marca || t.nombre) + '</h2><p class="desc">El WhatsApp con el que el asistente atiende a los compradores del lote. Los miembros comparten este mismo número.</p><div class="grid">' +
      '<div class="cd"><div class="lg">' + ico('phone') + '</div><div class="bd"><div class="t">WhatsApp del lote' + (t.telefono ? '<span class="pill ok"><i></i>Vinculado</span>' : '<span class="pill off"><i></i>Sin número</span>') + '</div><div class="s">' + (t.telefono ? '+52 ' + esc(telFmt(t.telefono)) : 'Todavía no hay número. Cuando lo tengas se vincula aquí.') + '</div></div></div>' +
      (t.horario ? '<div class="cd"><div class="lg">' + ico('cal') + '</div><div class="bd"><div class="t">Horario de atención</div><div class="s" style="margin-top:8px"><div class="kv">' + horarioTxt(t.horario) + '</div></div></div></div>' : '') + '</div>';
  }
}
function citaCard(c){ return '<div class="cd"><div class="lg">' + esc(ini(c.nombre)) + '</div><div class="bd"><div class="t">' + esc(c.nombre || 'Sin nombre') + pillEstado(c.estado) + '</div><div class="s">' + esc(c.auto || '') + '</div><div class="s">' + esc(c.situacion || c.cuando || '') + '</div></div></div>'; }
function horarioTxt(h){ const nd = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado']; return [1, 2, 3, 4, 5, 6, 0].map(d => { const r = h[String(d)] || h[d]; return '<span>' + nd[d] + '</span><div>' + (Array.isArray(r) ? hm(r[0]) + ' – ' + hm(r[1]) : 'cerrado') + '</div>'; }).join(''); }
function pintarCitas(keep){
  const M = $('main'); const hoy = new Date(Date.now() - TZ); if (!MES) MES = { y: hoy.getUTCFullYear(), m: hoy.getUTCMonth() };
  const first = new Date(Date.UTC(MES.y, MES.m, 1)); const start = new Date(first); start.setUTCDate(1 - first.getUTCDay());
  const porDia = {}; INFO.citas.forEach(c => { if (!c.ini_ts || c.estado === 'pospuesta') return; const ds = (c.dias && c.dias.length) ? c.dias : [ymd(c.ini_ts)]; ds.forEach(k => { (porDia[k] = porDia[k] || []).push(c); }); });
  let cells = ''; for (let i = 0; i < 42; i++) { const d = new Date(start.getTime() + i * 86400000); const k = d.toISOString().slice(0, 10); const out = d.getUTCMonth() !== MES.m; const esHoy = k === hoy.toISOString().slice(0, 10);
    cells += '<div class="d' + (out ? ' out' : '') + (esHoy ? ' hoy' : '') + '"><div class="n">' + d.getUTCDate() + '</div>' + (porDia[k] || []).map(c => '<span class="ev' + (['realizada', 'cancelada', 'no_llego'].includes(c.estado) ? ' fin' : (c.estado === 'en_camino' ? ' camino' : '')) + '" title="' + esc((c.nombre || '') + ' · ' + (c.auto || '')) + '">' + esc(((c.precision === 'hora' || c.precision === 'franja') && c.hora ? c.hora + ' ' : '') + (c.nombre || 'Sin nombre')) + '</span>').join('') + '</div>'; }
  const qn = Q.trim().toLowerCase(); const lista = INFO.citas.filter(c => !qn || ((c.nombre || '') + ' ' + (c.auto || '')).toLowerCase().includes(qn)).sort((a, b) => (VIVAS.includes(b.estado) - VIVAS.includes(a.estado)) || (a.ini_ts || 0) - (b.ini_ts || 0));
  M.innerHTML = '<h2>Citas agendadas</h2><p class="desc">Todas las citas del lote, las vivas y las que ya pasaron. El asistente les da seguimiento solo; aquí las ves de un vistazo.</p>' +
    '<div class="calh"><button class="ib" id="c-prev">' + ico('l') + '</button><b>' + MESES[MES.m] + ' ' + MES.y + '</b><button class="ib" id="c-next">' + ico('r') + '</button></div><div class="cal">' + ['D', 'L', 'M', 'M', 'J', 'V', 'S'].map(x => '<div class="dn">' + x + '</div>').join('') + cells + '</div>' +
    '<div style="height:22px"></div>' + tools('Buscar cita…') + '<p class="count"><b>' + INFO.citas.filter(c => VIVAS.includes(c.estado)).length + '</b> vivas · <b>' + INFO.citas.filter(c => !VIVAS.includes(c.estado)).length + '</b> cerradas</p><div class="grid">' + (lista.map(citaCard).join('') || '<div class="vacio">Sin citas.</div>') + '</div>';
  $('c-prev').onclick = () => { MES.m--; if (MES.m < 0) { MES.m = 11; MES.y--; } pintarCitas(); }; $('c-next').onclick = () => { MES.m++; if (MES.m > 11) { MES.m = 0; MES.y++; } pintarCitas(); };
  bindQ(); if (keep) { const q = $('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}
async function recargar(){ const r = await get('panel_info', { vendedor: String(INFO.tenant.id) }); if (r.ok) { INFO = r; contar(); pintarSideFC(); pintar(); } }
</script>
