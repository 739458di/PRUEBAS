<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba las citas de TERRA</title>
<style>
:root{
  --bg:#0c0e13; --p1:#12151d; --p2:#191d28; --ln:#252b3b; --ln2:#343d55;
  --tx:#eef1f8; --dim:#a3adc4; --mut:#6d7790;
  --ok:#3ddc97; --warn:#ffc857; --bad:#ff6b7a; --azul:#6aa9ff;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--f);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.4;cursor:default}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:5px}

.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--ln);background:var(--p1)}
.top h1{font-size:16px;font-weight:800}
.top select,.top .b{height:36px;padding:0 14px;border-radius:10px;background:var(--p2);border:1px solid var(--ln2);font-size:14px;color:var(--tx)}
.top .b.pri{background:var(--ok);border-color:var(--ok);color:#04231a;font-weight:700}
.top .sp{flex:1}.top .reloj{font-size:13.5px;color:var(--dim)}.top .reloj b{color:var(--warn);font-weight:700}

.cols{display:grid;grid-template-columns:minmax(300px,1fr) minmax(360px,1.1fr) minmax(360px,1.1fr);height:calc(100% - 56px)}
.col{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--ln)}.col:last-child{border-right:0}
.col>h2{flex:0 0 auto;padding:14px 20px;font-size:15px;font-weight:800;border-bottom:1px solid var(--ln);background:var(--p1)}
.scr{flex:1;overflow-y:auto;padding:18px 20px 28px}

/* conversación */
.chat{display:flex;flex-direction:column;gap:7px}
.m{max-width:86%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.m.in{align-self:flex-end;background:#1f6f54;color:#eafff6;border-bottom-right-radius:5px}
.m.out{align-self:flex-start;background:var(--p2);border-bottom-left-radius:5px}
.m.pens{opacity:.6;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 0;border-top:1px solid var(--ln);background:var(--p1)}
.chips button{padding:6px 11px;border-radius:999px;background:var(--p2);border:1px solid var(--ln2);font-size:13px;color:var(--dim)}
.chips button:hover{color:var(--tx);border-color:var(--ok)}
.comp{display:flex;gap:8px;padding:10px 14px 14px;background:var(--p1)}
.comp textarea{flex:1;min-height:44px;max-height:120px;resize:none;padding:11px 13px;border-radius:13px;background:var(--p2);border:1px solid var(--ln2);color:var(--tx);font:inherit;outline:none}
.comp textarea:focus{border-color:var(--ok)}
.comp button{width:48px;border-radius:13px;background:var(--ok);color:#04231a;font-weight:800;font-size:18px}

/* qué pasó */
.t{border:1px solid var(--ln);border-radius:16px;background:var(--p1);padding:16px 18px;margin-bottom:14px}
.t.ult{border-color:var(--ok)}
.t.viejo{padding:10px 14px;opacity:.75}.t.viejo .fila,.t.viejo details{display:none}.t.viejo .dijo{margin:0;font-size:13.5px}.t.viejo .res{display:block}
.t .res{display:none;color:var(--dim);font-size:13px;margin-top:2px}
.dijo{font-size:15px;margin-bottom:12px}.dijo span{color:var(--mut);font-size:12.5px;display:block;margin-bottom:1px}
.fila{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--ln)}
.fila>label{font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--mut);padding-top:3px}
.ent{font-size:17px;font-weight:800}.ent small{display:block;font-size:13px;font-weight:400;color:var(--dim);margin-top:2px}
.cam{font-size:15.5px;font-weight:700}.cam .a{color:var(--mut);font-weight:500;text-decoration:line-through}.cam .fl{color:var(--mut);margin:0 6px}.cam .d{color:var(--ok)}.cam.igual{color:var(--dim);font-weight:500}
.cam small{display:block;font-size:13px;font-weight:400;color:var(--dim);margin-top:2px}
.h{display:flex;gap:8px;margin-bottom:6px;font-size:14px}.h:last-child{margin-bottom:0}.h i{flex:0 0 auto;font-style:normal;color:var(--ok)}.h.no i{color:var(--mut)}.h q{quotes:none;color:var(--dim)}
.ojo{margin-top:8px;padding:8px 11px;border-radius:10px;background:rgba(255,200,87,.1);color:var(--warn);font-size:13.5px}
details{margin-top:10px;border-top:1px solid var(--ln);padding-top:8px}summary{cursor:pointer;color:var(--mut);font-size:13px}details div{margin-top:6px;font-size:12.5px;color:var(--dim);white-space:pre-wrap}

/* cómo está y qué sigue */
.real{border:1px solid var(--ln);border-radius:16px;background:var(--p1);padding:18px;margin-bottom:6px}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:800;background:rgba(61,220,151,.16);color:var(--ok)}
.pill.w{background:rgba(255,200,87,.16);color:var(--warn)}.pill.m{background:var(--p2);color:var(--dim)}.pill.b{background:rgba(255,107,122,.16);color:var(--bad)}
.real .big{font-size:22px;font-weight:800;margin:10px 0 3px}.real .sit{color:var(--dim);font-size:14px}
h3{margin:22px 0 10px;font-size:15px;font-weight:800}h3 small{font-weight:400;color:var(--mut);font-size:13px}
.sg{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--ln)}
.sg:first-of-type{border-top:0}
.sg .cu{font-size:13px;color:var(--dim);padding-top:2px}.sg .cu b{display:block;color:var(--tx);font-size:14px}
.sg .q{font-size:14.5px;font-weight:600}.sg .tx{margin-top:4px;color:var(--dim);font-size:13.5px;white-space:pre-wrap}.sg .si{margin-top:3px;font-size:12.5px;color:var(--warn)}
.sg.prox .q{color:var(--azul)}.sg.lejos{opacity:.7}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns button,.btns input{height:38px;padding:0 14px;border-radius:10px;background:var(--p2);border:1px solid var(--ln2);font-size:14px;font-weight:600;color:var(--tx)}
.btns button.pri{background:var(--azul);border-color:var(--azul);color:#04162e}.btns button.ok{background:var(--ok);border-color:var(--ok);color:#04231a}.btns button.no{border-color:rgba(255,107,122,.6);color:var(--bad)}
.btns input{font-family:var(--f);color-scheme:dark}
.hint{font-size:13px;color:var(--mut);margin-top:8px}
.vacio{padding:36px 10px;text-align:center;color:var(--mut)}
.err{margin:60px auto;max-width:460px;text-align:center;color:var(--dim)}.err b{display:block;color:var(--tx);font-size:16px;margin-bottom:8px}.err a{color:var(--ok)}
@media (max-width:1100px){body{overflow:auto}.cols{grid-template-columns:1fr;height:auto}.col{border-right:0;border-bottom:1px solid var(--ln);min-height:60vh}}
</style>
</head>
<body>
<div class="top">
  <h1>Prueba las citas de TERRA</h1>
  <select id="chats" title="Cliente de prueba"></select>
  <button class="b pri" id="nuevo">+ Cliente nuevo</button>
  <button class="b" id="borrar">Borrar</button>
  <div class="sp"></div>
  <div class="reloj" id="reloj"></div>
</div>
<div class="cols" id="cols">
  <section class="col">
    <h2>1 · Escribe como el cliente</h2>
    <div class="scr" id="chatScr"><div class="chat" id="chat"></div></div>
    <div class="chips" id="chips"></div>
    <div class="comp"><textarea id="tx" rows="1" placeholder="Por ejemplo: voy el sábado como a las 5"></textarea><button id="send" aria-label="Enviar">➤</button></div>
  </section>
  <section class="col">
    <h2>2 · Qué entendió y qué hizo</h2>
    <div class="scr" id="ops"></div>
  </section>
  <section class="col">
    <h2>3 · Cómo está la visita y qué sigue</h2>
    <div class="scr" id="fut"></div>
  </section>
</div>
<script>
const API = '/api/seb-panel'; const QS = new URLSearchParams(location.search); const VEND = QS.get('vendedor') || '9';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clave = p => p + ':' + Date.now() + ':' + Math.random().toString(36).slice(2, 8);
async function get(action, params){ const r = await fetch(API + '?action=' + action + '&vendedor=' + encodeURIComponent(VEND) + (params ? '&' + new URLSearchParams(params) : ''), { credentials: 'same-origin' }); const j = await r.json().catch(() => ({ ok: false, error: 'Respuesta inválida (' + r.status + ')' })); j._status = r.status; return j; }
async function post(action, body){ const r = await fetch(API + '?action=' + action + '&vendedor=' + encodeURIComponent(VEND), { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ action, vendedor: VEND }, body || {})) }); const j = await r.json().catch(() => ({ ok: false, error: 'Respuesta inválida (' + r.status + ')' })); j._status = r.status; return j; }

let TEN = null, CHAT = null, OCUPADO = false, TURNOS = [], EST = null;
const FRASES = ['voy el sábado como a las 5', 'paso entre viernes y sábado', 'mejor a las 6', 'se me hizo tarde', 'hoy no alcanzo', 'yo te aviso', 'ya voy', 'ya llegué', 'mejor el jueves a las 5. ¿Aceptan crédito?'];
const EST_TXT = { viva: 'Visita viva', en_camino: 'Viene en camino', pospuesta: 'Sin fecha', realizada: 'Sí asistió', cancelada: 'Canceló', no_llego: 'No asistió', sin_cierre: 'Sin cierre', reemplazada: 'Reemplazada' };
// lo que ENTENDIÓ, dicho en cristiano
const ENTENDI = { agenda_o_cambio: 'Dijo cuándo viene', confirma: 'Confirmó que viene', se_retrasa: 'Va tarde', promete_avisar: 'Dijo “yo te aviso” (se queda sin fecha)', ya_voy: 'Ya viene en camino', ya_llegue: 'Ya llegó', ya_fue: 'Dice que ya fue', se_complico: 'No alcanza a venir', cancela: 'Canceló', cambia_auto: 'Quiere ver otro auto', incierto: 'No quedó claro si viene', no_es_de_cita: 'No habló de la visita', otra_cosa: 'Dijo algo de la visita que no sé resolver', intencion: 'Quiere venir, pero no dijo qué día' };
// lo que SIGUE, dicho en cristiano
const SIGUE = { r1: 'Le recuerdo su visita', vispera: 'Le recuerdo que es mañana', dia: 'Le pregunto si sigue en pie', dia_multi: 'Le digo que hoy lo esperamos', dia_ultimo: 'Le pregunto si alcanza a venir hoy', empujon: 'Le vuelvo a preguntar', marcar: 'Te aviso a ti para que le marques', marcar_pregunta: 'Te aviso a ti para que le marques', me_avisas: 'Le pido que avise cuando venga', revision_suave: 'Le recuerdo que hoy también puede pasar', vence: 'Se acaba su ventana sin que llegara', aclaracion: 'Le pregunto si fue o si todavía viene' };
const SI = { r1: 'No sale si platicó hace poco', dia: 'No sale si ya confirmó', empujon: 'Solo si no contestó', marcar: 'Solo si sigue sin contestar', marcar_pregunta: 'Solo si no contestó', me_avisas: 'Solo si ya confirmó el día' };
const corto = (x, n) => { x = String(x || '').replace(/\s*\n\s*/g, ' · '); return x.length > n ? x.slice(0, n - 1) + '…' : x; };

function pill(c){ if (!c) return '<span class="pill m">Sin visita</span>'; const venc = c.vencida || (c.banderas && c.banderas.ultima_palabra === 'ventana_vencida'); const cl = c.estado === 'realizada' ? '' : (['cancelada', 'no_llego'].includes(c.estado) ? 'b' : (c.estado === 'pospuesta' ? 'm' : (venc || c.en_duda ? 'w' : ''))); return '<span class="pill ' + cl + '">' + esc(venc ? 'Se venció sin que llegara' : (c.en_duda && c.estado === 'viva' ? 'Fecha por definir' : (EST_TXT[c.estado] || c.estado))) + '</span>'; }
function resumenFoto(f){ if (!f) return 'sin visita'; if (f.estado === 'pospuesta') return 'sin fecha'; if (f.estado === 'realizada') return 'sí asistió'; if (f.estado === 'cancelada') return 'cancelada'; if (f.estado === 'no_llego') return 'no asistió'; const bd = f.banderas || {}; if (bd.ultima_palabra === 'ventana_vencida') return 'se venció sin que llegara'; if (bd.en_duda) return 'fecha por definir (ya no aplica ' + f.cuando + ')'; if (bd.ultima_palabra === 'se_retrasa' && f.estado !== 'en_camino') return 'hoy, hora por confirmar'; return (f.estado === 'en_camino' ? 'en camino · ' : '') + f.cuando + (f.auto ? ' · ' + f.auto : ''); }

function turnoHTML(t, i){
  const viejo = i > 0; let h = '', res = '';
  const H = (txt, cita) => '<div class="h"><i>✓</i><span>' + txt + (cita ? ' <q>“' + esc(corto(cita, 150)) + '”</q>' : '') + '</span></div>';
  if (t.tipo === 'mensaje') {
    const T = t.traza || {}, L = T.lectura || {}, A = T.acciones || {}; const deCita = t.evento && !['no_es_de_cita', 'intencion'].includes(t.evento);
    let ent = ENTENDI[t.evento] || ENTENDI[L.evento] || 'No habló de la visita'; if (t.evento === 'agenda_o_cambio') ent = T.antes && T.antes.estado !== 'pospuesta' ? 'Cambió el cuándo' : (T.antes ? 'Ya dio fecha otra vez' : 'Agendó una visita');
    h += '<div class="dijo"><span>El cliente dijo</span>“' + esc(t.texto) + '”</div>';
    h += '<div class="fila"><label>ENTENDÍ</label><div><div class="ent">' + esc(ent) + '<small>' + esc(corto(L.razon || '', 170)) + '</small></div>' + ((T.ajustes || []).length ? '<div class="ojo">' + T.ajustes.map(esc).join('<br>') + '</div>' : '') + '</div></div>';
    const a = resumenFoto(T.antes), d = resumenFoto(T.despues);
    h += '<div class="fila"><label>LA VISITA</label><div>' + (!deCita ? '<div class="cam igual">No cambió' + (T.antes ? ' (' + esc(a) + ')' : '') + '</div>' : (a === d ? '<div class="cam igual">Sigue igual: ' + esc(d) + '<small>' + esc(T.despues ? T.despues.situacion : '') + '</small></div>' : '<div class="cam">' + (T.antes ? '<span class="a">' + esc(a) + '</span><span class="fl">→</span>' : '') + '<span class="d">' + esc(d) + '</span><small>' + esc(T.despues ? T.despues.situacion : '') + '</small></div>')) + '</div></div>';
    let hice = '';
    if (T.comercial) hice += T.comercial.respondida ? H('También preguntó “' + esc(corto(T.comercial.texto, 60)) + '” y Seb se lo contestó:', ((t.comercial && t.comercial.textos) || []).join(' · ')) : H('También preguntó “' + esc(corto(T.comercial.texto, 60)) + '”: te avisé para que se lo contestes tú');
    if (deCita) {
      const msgs = (A.mensajes || []).filter(x => !/^📍/.test(x)); if (msgs.length) hice += H('Le contesté:', msgs.join(' · ')); if ((A.mensajes || []).some(x => /^📍/.test(x))) hice += H('Le mandé la ubicación');
      (A.avisos_vendedor || []).forEach(x => hice += H('Te avisé a ti:', x));
      const nc = (A.recordatorios_cancelados || []).length, nn = (A.recordatorios_creados || []).length;
      if (nc && nn) hice += H('Cancelé ' + nc + ' mensajes programados que ya no aplicaban y programé ' + nn + ' nuevos'); else if (nc) hice += H('Cancelé ' + nc + ' mensajes programados que ya no aplican'); else if (nn) hice += H('Programé ' + nn + ' mensajes (míralos en la columna 3)');
      if (!hice) hice = '<div class="h no"><i>·</i><span>Nada: no hacía falta.</span></div>';
    } else {
      const sb = t.seb || {}; if ((sb.textos || []).length) hice += H('Seb le contestó:', sb.textos.join(' · ')); else if (sb.escalar) hice += H('No le contesté: te lo pasé a ti', sb.escala_motivo || ''); else hice += '<div class="h no"><i>·</i><span>Seb no contestó nada' + (sb.motivo ? ' (' + esc(sb.motivo) + ')' : '') + '.</span></div>';
    }
    h += '<div class="fila"><label>HICE</label><div>' + hice + '</div></div>';
    const det = []; if (L.evento) det.push((T.sin_ia ? 'Lo resolvió una regla fija, sin gastar IA.' : 'Lo interpretó la IA (confianza ' + (L.confianza || '?') + ').') + ' Evento interno: ' + L.evento); ['dia_ini', 'dia_fin', 'hora_ini', 'hora_fin', 'franja', 'minutos_tarde', 'auto_texto', 'restriccion', 'asiste', 'condicion', 'motivo'].forEach(k => { if (L[k]) det.push(k + ': ' + L[k]); });
    (A.recordatorios_cancelados || []).forEach(k => det.push('Cancelado: ' + (SIGUE[k.tipo] || k.tipo) + ' (' + k.cuando + ') — ' + (k.motivo || ''))); (A.recordatorios_creados || []).forEach(k => det.push('Programado: ' + (SIGUE[k.tipo] || k.tipo) + ' (' + k.cuando + ')'));
    if (det.length) h += '<details><summary>Ver detalle técnico</summary><div>' + esc(det.join('\n')) + '</div></details>';
    res = ent + (deCita && a !== d ? ' → ' + d : '');
  } else if (t.tipo === 'reloj') {
    h += '<div class="dijo"><span>Pasó el tiempo</span>Ahora es ' + esc(t.ahora || '') + '</div>';
    const sal = (t.hechas || []).filter(k => k.salio), no = (t.hechas || []).filter(k => !k.salio); let x = '';
    sal.forEach(k => x += H(esc(SIGUE[k.tipo] || k.tipo) + (k.para === 'comprador' ? ':' : ''), k.para === 'comprador' ? k.texto : '')); no.forEach(k => x += '<div class="h no"><i>✕</i><span>No salió “' + esc(SIGUE[k.tipo] || k.tipo) + '”: ' + esc(k.motivo || '') + '</span></div>');
    h += '<div class="fila"><label>PASÓ</label><div>' + (x || '<div class="h no"><i>·</i><span>Nada: todavía no tocaba ningún mensaje.</span></div>') + '</div></div>'; res = sal.length ? sal.map(k => SIGUE[k.tipo] || k.tipo).join(' · ') : 'no tocaba nada';
  } else {
    h += '<div class="dijo"><span>Tú, como vendedor</span>' + esc(t.titulo.replace(/^Vendedor: /, '')) + '</div><div class="fila"><label>RESULTADO</label><div>' + (t.ok ? '<div class="cam"><span class="d">' + esc(t.res && t.res.estado ? (EST_TXT[t.res.estado] || t.res.estado) : 'Listo') + '</span></div>' : '<div class="ojo">' + esc(t.error || 'No se pudo') + '</div>') + '</div></div>'; res = t.ok ? 'listo' : 'no se pudo';
  }
  return '<div class="t ' + (viejo ? 'viejo' : 'ult') + '">' + h + '<div class="res">' + esc(res) + '</div></div>';
}
function pintarOps(){ $('ops').innerHTML = TURNOS.length ? TURNOS.map(turnoHTML).join('') : '<div class="vacio">Escribe algo como cliente y aquí verás, en tres renglones, qué entendí, cómo quedó la visita y qué hice.</div>'; $('ops').scrollTop = 0; }

function pintarFut(){
  const r = EST, el = $('fut'); if (!r || !r.ok) { el.innerHTML = '<div class="vacio">' + esc((r && r.error) || 'Crea un cliente para empezar.') + '</div>'; return; }
  $('reloj').innerHTML = 'En la prueba hoy es <b>' + esc(r.reloj.ahora) + '</b>';
  const c = r.cita; let h = '';
  if (!c) { el.innerHTML = '<div class="real">' + pill(null) + '<div class="big">Todavía no hay visita</div><div class="sit">Nace sola cuando el cliente dice un día: “voy el sábado”, “mañana en la tarde”, “entre viernes y sábado”.</div></div>' + masHTML(null); return; }
  h += '<div class="real">' + pill(c) + '<div class="big">' + esc(c.estado === 'pospuesta' ? 'Sin fecha' : (c.vencida ? 'Era ' + c.ventana : (c.en_duda && c.estado === 'viva' ? 'Ya no aplica: ' + c.cuando : c.cuando))) + '</div><div class="sit">' + esc(c.auto || 'Sin auto') + (c.resultado ? ' · ' + esc(c.resultado) : '') + '</div><div class="sit" style="margin-top:6px">' + esc(c.situacion || '') + '</div></div>';
  const lista = (r.casillas || []).filter(k => k.estado === 'pendiente').concat(r.proyeccion || []).sort((a, b) => a.due_ts - b.due_ts);
  h += '<h3>Lo que sigue <small>si el cliente no dice nada</small></h3>';
  if (!lista.length) h += '<p class="hint" style="margin-top:0">' + (c.estado === 'pospuesta' ? 'Nada. Sin fecha no se le persigue: vuelve a activarse cuando diga un día o diga “ya voy”.' : (c.vencida ? 'Nada más. Ya se le preguntó si fue o si todavía viene; si no contesta no se concluye nada. Decide él o decides tú con los botones.' : (c.viva ? 'Nada programado.' : 'Nada: esta visita ya terminó.'))) + '</p>';
  lista.forEach((k, i) => { const p = String(k.cuando).split(' · '); h += '<div class="sg' + (i === 0 ? ' prox' : '') + '"><div class="cu"><b>' + esc(p[0] || '') + '</b>' + esc(p[1] || '') + '</div><div><div class="q">' + esc(SIGUE[k.tipo] || k.texto_tipo || k.tipo) + '</div>' + (k.previa && k.para === 'comprador' ? '<div class="tx">“' + esc(k.previa) + '”</div>' : (k.tipo === 'vence' ? '<div class="tx">La visita NO se cancela: sigue viva, te aviso a ti y a la mañana siguiente le pregunto.</div>' : '')) + (SI[k.tipo] ? '<div class="si">' + esc(SI[k.tipo]) + '</div>' : '') + '</div></div>'; });
  if (lista.length) h += '<div class="btns" style="margin-top:14px"><button class="pri" data-r="siguiente">▶ Que pase lo siguiente</button><button data-m="86400000">+1 día</button><button data-r="reset">Volver a hoy</button></div><p class="hint">Adelanta el tiempo para ver qué sale. Lo que pase aparece en la columna 2.</p>';
  if (c.viva || c.estado === 'realizada') h += '<h3>' + (c.estado === 'realizada' ? '¿Cómo le fue?' : '¿Llegó el cliente?') + '</h3><div class="btns">' + (c.estado === 'realizada' ? ['compró', 'apartó', 'no compró', 'sigue pensando'].map(x => '<button data-res="' + x + '"' + (c.resultado === x ? ' class="ok"' : '') + '>' + x.charAt(0).toUpperCase() + x.slice(1) + '</button>').join('') : '<button class="ok" data-v="llego">Sí llegó</button><button class="no" data-v="no_llego">No llegó</button>') + '</div>';
  el.innerHTML = h + masHTML(c);
}
function masHTML(c){
  const ev = (EST && EST.eventos) || [];
  return '<details style="margin-top:22px"><summary>Más opciones</summary><h3 style="margin-top:14px">' + (c && c.viva ? 'Mover la visita yo' : 'Agendar yo la visita') + '</h3><div class="btns"><input type="date" id="fDia"><input type="time" id="fHora"><button data-ag="1">Guardar</button></div><p class="hint">La hora es opcional.</p>' +
    (c && c.viva && c.estado !== 'pospuesta' ? '<h3>Otras acciones</h3><div class="btns"><button data-v="mueve">Dejarla sin fecha</button><button data-v="auto_vendido">El auto se vendió</button></div>' : '') +
    '<h3>Reloj</h3><div class="btns"><button data-m="3600000">+1 hora</button><button data-m="21600000">+6 horas</button><button data-r="fin">Hasta que se venza</button></div>' +
    (ev.length ? '<h3>Historia de esta visita</h3>' + ev.map(e => '<div class="sg"><div class="cu">' + esc(e.cuando) + '</div><div><div class="q" style="font-weight:500">' + esc(String(e.evento).replace(/_/g, ' ')) + '</div>' + (e.dijo ? '<div class="tx">“' + esc(e.dijo) + '”</div>' : '') + '</div></div>').join('') : '') + '</details>';
}

async function cargarChat(){
  if (!CHAT) { $('chat').innerHTML = '<div class="vacio">Crea un cliente de prueba para empezar.</div>'; return; }
  const r = await get('hilo', { chat_id: CHAT, antes: Date.now() + 86400000 * 400, limit: 60 }); if (!r.ok) return;
  const ms = (r.mensajes || []).slice().sort((a, b) => (a.ts || 0) - (b.ts || 0));
  $('chat').innerHTML = ms.map(m => { const sis = m.emisor === 'sistema'; const tx = m.media && m.media.tipo === 'ubicacion' ? '📍 Ubicación: ' + (m.media.nombre || '') + (m.media.url ? ' · ' + m.media.url : '') : (m.media && m.media.tipo === 'imagen' ? (/captura del punto/.test(String(m.texto || '')) ? '🖼 Captura del punto de venta' : '🖼 Foto') : String(m.texto || '')); if (sis) return ''; return '<div class="m ' + (m.dir === 'in' ? 'in' : 'out') + '">' + esc(/^ubic-img:/.test(tx) ? '🖼 Captura de ubicación' : (/\|\|\|/.test(tx) ? '📍 ' + tx.split('|||')[0] : tx)) + '</div>'; }).join('') || '<div class="vacio">Sin mensajes. Escribe abajo.</div>';
  const s = $('chatScr'); s.scrollTop = s.scrollHeight;
}
async function cargarEstado(){ EST = CHAT ? await post('citaf_estado', { chat_id: CHAT }) : null; pintarFut(); }
function bloquear(on){ OCUPADO = on; document.querySelectorAll('#send,#fut button,#chips button,#nuevo,#borrar').forEach(b => b.disabled = on); }
const horaYa = () => new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

async function enviar(texto){
  texto = String(texto || '').trim(); if (!texto || OCUPADO || !CHAT) return; $('tx').value = ''; bloquear(true);
  $('chat').insertAdjacentHTML('beforeend', '<div class="m in">' + esc(texto) + '</div><div class="m out pens" id="pens">Seb está pensando…</div>'); const s = $('chatScr'); s.scrollTop = s.scrollHeight;
  try {
    const a = await post('demo_responder', { chat_id: CHAT, texto }); if (!a.ok) throw new Error(a.error || 'no se registró el mensaje');
    const r = await post('seb_turno', { chat_id: CHAT }); const cf = r.cita_flex || null;
    TURNOS.unshift({ tipo: 'mensaje', titulo: 'Cliente: “' + texto.slice(0, 60) + (texto.length > 60 ? '…' : '') + '”', hora: horaYa(), texto, evento: cf ? cf.evento : null, traza: cf ? cf.traza : null, seb: r.seb || null, comercial: r.comercial || null });
  } catch (e) { TURNOS.unshift({ tipo: 'vendedor', titulo: 'Error', hora: horaYa(), evento: 'error', ok: false, error: e.message }); }
  await Promise.all([cargarChat(), cargarEstado()]); pintarOps(); bloquear(false); $('tx').focus();
}
async function reloj(body){ if (OCUPADO || !CHAT) return; bloquear(true); const r = await post('citaf_reloj', Object.assign({ chat_id: CHAT }, body)); if (r.ok) { const mias = (r.hechas || []).map(k => Object.assign({ texto_tipo: ((EST && (EST.casillas || []).concat(EST.proyeccion || []).find(x => x.tipo === k.tipo)) || {}).texto_tipo || k.tipo }, k)); TURNOS.unshift({ tipo: 'reloj', titulo: r.sin_siguiente ? 'Reloj: no queda nada programado' : 'Reloj → ' + (r.reloj ? r.reloj.ahora : ''), hora: horaYa(), ahora: r.reloj ? r.reloj.ahora : '', hechas: mias }); EST = r; } else TURNOS.unshift({ tipo: 'vendedor', titulo: 'Reloj', hora: horaYa(), evento: 'reloj', ok: false, error: r.error }); await cargarChat(); if (!r.ok) await cargarEstado(); else pintarFut(); pintarOps(); bloquear(false); }
async function vendedor(evento, extra){ if (OCUPADO || !CHAT) return; bloquear(true); const r = await post('citaf_vendedor', Object.assign({ chat_id: CHAT, evento }, extra || {})); TURNOS.unshift({ tipo: 'vendedor', titulo: 'Vendedor: ' + ({ llego: 'Marcaste que SÍ llegó', no_llego: 'Marcaste que NO llegó', mueve: 'La dejaste sin fecha', auto_vendido: 'Marcaste que el auto se vendió', agenda: 'Agendaste / moviste la visita', resultado: 'Anotaste cómo le fue' }[evento] || evento), hora: horaYa(), evento, datos: extra && (extra.datos || (extra.resultado ? { resultado: extra.resultado } : null)), ok: !!r.ok, res: r.vendedor || null, error: r.error }); if (r.ok) EST = r; await cargarChat(); if (!r.ok) await cargarEstado(); else pintarFut(); pintarOps(); bloquear(false); }

async function cargarChats(sel){
  const r = await get('inbox', { limit: 100, filtro: 'todos' }); const l = (r.chats || r.rows || r.conversaciones || []); const o = $('chats');
  o.innerHTML = l.length ? l.map(c => '<option value="' + c.chat_id + '" data-tel="' + esc(String(c.telefono || '')) + '">' + esc((c.nombre && c.nombre !== '.' ? c.nombre : '+' + String(c.telefono || '')) + (c.cita ? ' · con visita' : '')) + '</option>').join('') : '<option value="">(sin clientes)</option>';
  if (sel && l.some(c => Number(c.chat_id) === Number(sel))) o.value = String(sel); CHAT = o.value ? Number(o.value) : null;
}
async function abrir(){ TURNOS = []; pintarOps(); await Promise.all([cargarChat(), cargarEstado()]); }
async function nuevoCliente(){
  if (OCUPADO) return; bloquear(true); const autos = (TEN && TEN.autos) || []; if (!autos.length) { alert('Este universo no tiene autos.'); bloquear(false); return; }
  const usados = new Set([...$('chats').options].map(o => String(o.dataset.tel || '').slice(-2))); const libres = []; for (let n = 10; n <= 99; n++) { const x = String(n); if (!usados.has(x)) libres.push(x); } if (!libres.length) { alert('Ya hay 90 clientes de prueba: borra alguno.'); bloquear(false); return; }
  const tel = '52100000000' + libres[Math.floor(Math.random() * libres.length)]; const nombre = 'Cliente ' + tel.slice(-2);
  const r = await post('delegar_v2', { telefono: tel, nombre, auto_id: autos[0].id, entrada: { modo: 'silencio', entrante: true }, clave: clave('entrena') });
  if (!r.ok || !r.chat_id) { alert(r.error || 'No pude crear el cliente'); bloquear(false); return; }
  await cargarChats(r.chat_id); await abrir(); bloquear(false); $('tx').focus();
}
async function borrarCliente(){ if (OCUPADO || !CHAT) return; if (!confirm('¿Borrar este cliente de prueba con su chat y su visita?')) return; bloquear(true); await post('chat_borrar', { chat_id: CHAT }); await cargarChats(); await abrir(); bloquear(false); }

(async () => {
  const t = await get('tenant_info', {});
  if (!t.ok) { $('cols').innerHTML = '<div class="err" style="grid-column:1/-1"><b>' + (t._status === 401 || t.login ? 'Primero entra a FyraChat en este navegador' : 'No pude abrir el universo') + '</b>' + esc(t.error || '') + '<br><br><a href="/fyrachat.html?vendedor=' + encodeURIComponent(VEND) + '">Abrir FyraChat</a> y luego vuelve a esta página.</div>'; return; }
  TEN = Object.assign({}, t.tenant, { autos: t.autos || [] });
  if (!TEN.citas_flex) { $('cols').innerHTML = '<div class="err" style="grid-column:1/-1"><b>Este universo no tiene las visitas flexibles encendidas</b>El panel de entrenamiento es de TERRA MOTORS.</div>'; return; }
    $('chips').innerHTML = FRASES.map(f => '<button>' + esc(f) + '</button>').join('');
  $('chips').onclick = e => { const b = e.target.closest('button'); if (b) enviar(b.textContent); };
  $('send').onclick = () => enviar($('tx').value); $('tx').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar($('tx').value); } };
  $('chats').onchange = () => { CHAT = $('chats').value ? Number($('chats').value) : null; abrir(); };
  $('nuevo').onclick = nuevoCliente; $('borrar').onclick = borrarCliente;
  $('fut').onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return; if (b.dataset.r) return reloj({ accion: b.dataset.r }); if (b.dataset.m) return reloj({ accion: 'mas', ms: Number(b.dataset.m) }); if (b.dataset.v) return vendedor(b.dataset.v); if (b.dataset.res) return vendedor('resultado', { resultado: b.dataset.res }); if (b.dataset.ag) { const d = $('fDia').value; if (!d) return alert('Elige el día.'); return vendedor('agenda', { datos: { dia_ini: d, hora_ini: $('fHora').value || '' } }); } };
  await cargarChats(Number(QS.get('chat')) || null); await abrir();
})();
</script>
