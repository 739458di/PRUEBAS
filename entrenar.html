<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground de citas · TERRA</title>
<style>
:root{
  --bg:#0c0e13; --p1:#12151d; --p2:#191d28; --ln:#252b3b; --ln2:#343d55;
  --tx:#eef1f8; --dim:#a3adc4; --mut:#6d7790;
  --cli:#4aa3ff; --seb:#84d957; --cita:#f2b13c; --rojo:#ff4d4d; --gris:#5b6480;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --RH:40px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14.5px/1.45 var(--f);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}button:disabled{opacity:.4;cursor:default}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:5px}
.app{display:grid;grid-template-columns:370px 1fr;height:100%}

/* ── IZQUIERDA: el chat ── */
.chatcol{display:flex;flex-direction:column;border-right:1px solid var(--ln);background:#07080b;min-height:0}
.chead{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:12px;background:var(--cli);color:#04213f}
.chead select{flex:1;min-width:0;height:36px;border-radius:10px;border:0;padding:0 10px;font:600 14px var(--f);background:#fff;color:#04213f}
.chead button{height:36px;padding:0 12px;border-radius:10px;background:#04213f;color:#fff;font-weight:700;font-size:13px;white-space:nowrap}
.chead button.x{background:rgba(4,33,63,.18);color:#04213f;padding:0 10px}
.cscr{flex:1;overflow-y:auto;padding:14px 12px}
.chat{display:flex;flex-direction:column;gap:8px}
.m{max-width:84%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word;font-size:14px;color:#06121f}
.m.in{align-self:flex-end;background:var(--seb);border-bottom-right-radius:4px}
.m.out{align-self:flex-start;background:var(--cli);border-bottom-left-radius:4px}
.m.pens{opacity:.6;font-style:italic}
.m small{display:block;font-size:10.5px;font-weight:700;opacity:.6;margin-bottom:1px}
.chips{flex:0 0 auto;display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:#0f1117;border-top:1px solid var(--ln)}
.chips button{flex:0 0 auto;padding:6px 11px;border-radius:999px;background:var(--p2);border:1px solid var(--ln2);font-size:12.5px;color:var(--dim);white-space:nowrap}
.chips button:hover{color:var(--tx);border-color:var(--seb)}
.comp{flex:0 0 auto;display:flex;gap:8px;padding:12px;background:var(--cita)}
.comp textarea{flex:1;min-height:44px;max-height:110px;resize:none;padding:11px 13px;border-radius:12px;border:0;background:#fff;color:#1a1300;font:inherit;outline:none}
.comp button{width:48px;border-radius:12px;background:#1a1300;color:var(--cita);font-weight:800;font-size:18px}

/* ── DERECHA: calendario + franja ── */
.right{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--ln);background:var(--p1)}
.bar b{font-size:15px}.bar .now{color:var(--dim);font-size:13.5px}.bar .now i{font-style:normal;color:var(--rojo);font-weight:700}
.bar .sp{flex:1}
.bar button{height:34px;padding:0 13px;border-radius:9px;background:var(--p2);border:1px solid var(--ln2);font-size:13px;font-weight:600}
.bar button.pri{background:var(--rojo);border-color:var(--rojo);color:#fff}.bar button.ok{background:var(--seb);border-color:var(--seb);color:#0b2403}.bar button.no{border-color:rgba(255,77,77,.6);color:#ff8d8d}
.leg{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:4px 16px;padding:7px 16px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--ln);background:var(--p1)}
.leg span{display:inline-flex;align-items:center;gap:6px}.leg i{display:inline-block}
.calwrap{flex:1;min-height:0;overflow:auto;background:#fff;position:relative}
.cal{position:relative;min-width:100%}
.dh{position:sticky;top:0;z-index:30;display:flex;background:#fff;border-bottom:1px solid #111;height:34px}
.dh .g{flex:0 0 54px}.dh div.d{flex:1;min-width:150px;text-align:center;font:700 13px var(--f);color:#111;line-height:34px;border-left:1px solid #111;text-transform:capitalize}
.dh div.d.hoy{background:#ffecec;color:#c40000}
.body{position:relative;display:flex}
.gut{flex:0 0 54px;position:relative}
.gut span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:#666}
.dcol{flex:1;min-width:150px;position:relative;border-left:1px solid #111;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--RH) - 1px),#111 calc(var(--RH) - 1px),#111 var(--RH))}
.dcol .cerrado{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,#f0f0f0 0 6px,#fafafa 6px 12px);opacity:.9}
.visita{position:absolute;left:40px;right:30px;border-radius:12px;background:var(--cita);color:#2a1c00;padding:6px 8px;font:700 12px/1.25 var(--f);z-index:6;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.18);cursor:pointer}
.visita.abierta{left:40px;right:30px;background:rgba(242,177,60,.28);border:2px dashed var(--cita);box-shadow:none}
.visita.orig{background:none;border:2px dashed rgba(242,177,60,.7);box-shadow:none;z-index:4}
.visita.vencida{background:#d9d9d9;color:#444;border:2px dashed #999;box-shadow:none}
.visita.camino{background:var(--seb);color:#0b2403}.visita.fin{background:#cfd4e0;color:#333}
.visita small{display:block;font-weight:500;font-size:11px}
.hilo{position:absolute;left:20px;width:2px;margin-left:-1px;background:#111;z-index:5}
.pt{position:absolute;left:20px;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;z-index:8;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 1.5px #111}
.pt.sig{background:var(--rojo)}.pt.prog{background:var(--seb)}.pt.salio{background:#111}.pt.salio::after{content:"✓";position:absolute;inset:0;color:#fff;font:800 12px/16px var(--f);text-align:center}
.pt.muerto{left:auto;right:3px;margin-left:0;width:18px;height:18px;margin-top:-9px;background:#fff;box-shadow:0 0 0 1.5px var(--gris);opacity:.75}.pt.muerto::after{content:"✕";position:absolute;inset:0;color:var(--gris);font:800 10px/12px var(--f);text-align:center}
.pt.futuro{background:#fff;box-shadow:0 0 0 1.5px #111;border-style:dashed;border-color:var(--seb)}
.pt.vend{border-radius:5px}
.ptl{position:absolute;left:36px;right:26px;background:rgba(255,255,255,.88);border-radius:4px;padding:1px 3px;transform:translateY(-50%);font:600 11px/1.15 var(--f);color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:7;pointer-events:none}
.ptl.muerto{display:none}.ptl.futuro{color:#555;font-weight:500}
.evt{position:absolute;left:4px;width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid var(--cli);margin-top:-7px;z-index:8;cursor:pointer}
.ahora{position:absolute;left:54px;right:0;height:0;border-top:3px solid var(--rojo);z-index:20;pointer-events:none}
.perilla{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#000;border:3px solid #fff;box-shadow:0 0 0 2px var(--rojo);z-index:25;cursor:grab;touch-action:none}
.perilla.arr{cursor:grabbing;box-shadow:0 0 0 3px var(--cita)}
.ahora.fant{border-top:3px dashed var(--cita)}
.tip{position:fixed;z-index:60;max-width:340px;padding:10px 12px;border-radius:12px;background:#000;color:#fff;font-size:13px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.45);white-space:pre-wrap}
.tip b{display:block;font-size:13.5px}.tip span{color:#b9c2d8}.tip .am{color:var(--cita)}
.tip .bt{display:flex;gap:8px;margin-top:9px}.tip button{height:32px;padding:0 12px;border-radius:8px;font-weight:700;font-size:13px;background:var(--rojo);color:#fff}.tip button.s{background:#2a2f3d}

/* franja negra: EVENTO → ESTADO → FLUJO */
.franja{flex:0 0 auto;background:#000;border-top:1px solid #111;padding:14px 18px 16px;max-height:34vh;overflow-y:auto}
.fr{display:grid;grid-template-columns:1fr 26px 1fr 26px 1.25fr;gap:0;align-items:stretch}
.fr .fl{display:flex;align-items:center;justify-content:center;color:#666;font-size:20px}
.fb{padding:2px 4px}.fb label{display:block;font:800 11px var(--f);letter-spacing:.12em;color:#7f8aa8;margin-bottom:4px}
.fb .big{font-size:18px;font-weight:800;line-height:1.25}.fb .sub{font-size:13px;color:#b9c2d8;margin-top:3px}
.fb.ev .big{color:var(--cli)}.fb.es .big{color:var(--cita)}.fb.fj .big{color:var(--seb);font-size:15px;font-weight:700}
.fb .a{color:#7f8aa8;text-decoration:line-through;font-weight:500}
.fr2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid #1d2230;font-size:12.5px;color:#7f8aa8}
.fr2 button{height:28px;padding:0 10px;border-radius:7px;background:#151924;border:1px solid #2a3145;color:#cfd6ea;font-size:12.5px}
.fr2 .sp{flex:1}.fr2 details{flex-basis:100%}.fr2 summary{cursor:pointer}.fr2 details div{margin-top:6px;white-space:pre-wrap;color:#9aa5bf}
.vacio{padding:30px 10px;text-align:center;color:var(--mut)}
.err{margin:80px auto;max-width:460px;text-align:center;color:var(--dim)}.err b{display:block;color:var(--tx);font-size:16px;margin-bottom:8px}.err a{color:var(--seb)}
@media (max-width:900px){body{overflow:auto}.app{grid-template-columns:1fr;height:auto}.chatcol{height:70vh}.right{height:100vh}}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="chatcol">
    <div class="chead"><select id="chats" title="Cliente de prueba"></select><button id="nuevo">+ Cliente</button><button class="x" id="borrar" title="Borrar este cliente">🗑</button></div>
    <div class="cscr" id="chatScr"><div class="chat" id="chat"></div></div>
    <div class="chips" id="chips"></div>
    <div class="comp"><textarea id="tx" rows="1" placeholder="Escribe como el cliente…"></textarea><button id="send" aria-label="Enviar">➤</button></div>
  </section>
  <section class="right">
    <div class="bar"><b id="titulo">Calendario de la visita</b><span class="now" id="now"></span><div class="sp"></div>
      <button class="pri" id="bSig" title="Adelanta el reloj hasta la siguiente acción programada">▶ Que pase lo siguiente</button><button id="bHoy">Volver a hoy</button><button class="ok" id="bLlego">Sí llegó</button><button class="no" id="bNo">No llegó</button></div>
    <div class="leg"><span><i style="width:14px;height:14px;border-radius:4px;background:var(--cita)"></i>la visita</span><span><i style="width:12px;height:12px;border-radius:50%;background:var(--rojo)"></i>lo siguiente que va a pasar</span><span><i style="width:12px;height:12px;border-radius:50%;background:var(--seb)"></i>programado</span><span><i style="width:12px;height:12px;border-radius:50%;background:#111"></i>ya salió</span><span><i style="width:12px;height:12px;border-radius:50%;border:1.5px solid var(--gris)"></i>✕ a la derecha = cancelado por el último cambio</span><span><i style="width:12px;height:12px;border-radius:50%;border:2px dashed var(--seb)"></i>vendría después</span><span><i style="width:12px;height:12px;border-radius:3px;background:var(--seb)"></i>cuadrado = aviso a ti</span><span><i style="width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid var(--cli)"></i>algo que dijo el cliente</span><span>⬤ arrastra la perilla negra para mover el tiempo</span></div>
    <div class="calwrap" id="calwrap"><div class="cal" id="cal"></div></div>
    <div class="franja" id="franja"></div>
  </section>
</div>
<div class="tip" id="tip" hidden></div>
<script>
const API = '/api/seb-panel'; const QS = new URLSearchParams(location.search); const VEND = QS.get('vendedor') || '9';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clave = p => p + ':' + Date.now() + ':' + Math.random().toString(36).slice(2, 8);
async function get(action, params){ const r = await fetch(API + '?action=' + action + '&vendedor=' + encodeURIComponent(VEND) + (params ? '&' + new URLSearchParams(params) : ''), { credentials: 'same-origin' }); const j = await r.json().catch(() => ({ ok: false, error: 'Respuesta inválida (' + r.status + ')' })); j._status = r.status; return j; }
async function post(action, body){ const r = await fetch(API + '?action=' + action + '&vendedor=' + encodeURIComponent(VEND), { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ action, vendedor: VEND }, body || {})) }); const j = await r.json().catch(() => ({ ok: false, error: 'Respuesta inválida (' + r.status + ')' })); j._status = r.status; return j; }

let TEN = null, CHAT = null, OCUPADO = false, TURNOS = [], VER = 0, EST = null, GEO = null;
const FRASES = ['voy el sábado como a las 5', 'paso entre viernes y sábado', 'mejor a las 6', 'se me hizo tarde', 'hoy no alcanzo', 'yo te aviso', 'ya voy', 'ya llegué', 'mejor el jueves a las 5. ¿Aceptan crédito?'];
const EST_TXT = { viva: 'Visita viva', en_camino: 'Viene en camino', pospuesta: 'Sin fecha', realizada: 'Sí asistió', cancelada: 'Canceló', no_llego: 'No asistió', sin_cierre: 'Sin cierre', reemplazada: 'Reemplazada' };
const ENTENDI = { agenda_o_cambio: 'Dijo cuándo viene', confirma: 'Confirmó que viene', se_retrasa: 'Va tarde', promete_avisar: 'Dijo “yo te aviso”', ya_voy: 'Ya viene en camino', ya_llegue: 'Ya llegó', ya_fue: 'Dice que ya fue', se_complico: 'No alcanza a venir', cancela: 'Canceló', cambia_auto: 'Quiere ver otro auto', incierto: 'No quedó claro si viene', no_es_de_cita: 'No habló de la visita', otra_cosa: 'Dijo algo de la visita que no sé resolver', intencion: 'Quiere venir, pero no dijo qué día' };
const SIGUE = { r1: 'Le recuerdo su visita', vispera: 'Le recuerdo que es mañana', dia: 'Le pregunto si sigue en pie', dia_multi: 'Le digo que hoy lo esperamos', dia_ultimo: 'Le pregunto si alcanza a venir hoy', empujon: 'Le vuelvo a preguntar', marcar: 'Te aviso: márcale', marcar_pregunta: 'Te aviso: márcale', me_avisas: 'Le pido que avise cuando venga', revision_suave: 'Le recuerdo que hoy puede pasar', vence: 'Se acaba su ventana', aclaracion: 'Le pregunto si fue o si viene' };
const corto = (x, n) => { x = String(x || '').replace(/\s*\n\s*/g, ' · '); return x.length > n ? x.slice(0, n - 1) + '…' : x; };
// tiempo de Monterrey (UTC-6 fijo, igual que el motor)
const TZ = 6 * 3600000, DIA = 86400000, H0 = 7, H1 = 22;
const dia0 = ts => Math.floor((ts - TZ) / DIA) * DIA + TZ;
const horaF = ts => ((ts - TZ) % DIA + DIA) % DIA / 3600000;
const DS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const fmt = ts => { const d = new Date(ts - TZ); let h = d.getUTCHours(); const m = d.getUTCMinutes(), ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return DS[d.getUTCDay()].slice(0, 3) + ' ' + d.getUTCDate() + ' · ' + h + (m ? ':' + String(m).padStart(2, '0') : '') + ' ' + ap; };
const RH = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--RH')) || 40;

// ═══ CALENDARIO: puro reflejo de lo que devuelve el motor (citaf_estado). Aquí no se decide nada. ═══
function items(r){ const c = r.cita; if (!c) return []; const a = [];
  (r.casillas || []).forEach(k => { if (k.estado === 'cancelada' || k.estado === 'saltada') { if (k.version >= c.version - 1) a.push(Object.assign({ cls: 'muerto' }, k)); } else if (k.estado === 'enviada') a.push(Object.assign({ cls: 'salio' }, k)); else a.push(Object.assign({ cls: 'prog' }, k)); });
  (r.proyeccion || []).forEach(k => a.push(Object.assign({ cls: 'futuro' }, k)));
  a.sort((x, y) => x.due_ts - y.due_ts); const s = a.find(k => k.cls === 'prog'); if (s) s.cls = 'sig'; return a; }
function pintarCal(){
  const r = EST, el = $('cal'); if (!r || !r.ok) { el.innerHTML = '<div class="vacio" style="color:#666">' + esc((r && r.error) || 'Crea un cliente para empezar.') + '</div>'; return; }
  const now = r.reloj.ahora_ts, c = r.cita, its = items(r); $('now').innerHTML = 'ahora en la prueba: <i>' + esc(r.reloj.ahora) + '</i>' + (r.reloj.virtual ? ' · tiempo adelantado' : '');
  $('titulo').textContent = c ? ((c.vencida ? 'Se venció sin que llegara' : (EST_TXT[c.estado] || c.estado)) + (c.estado === 'pospuesta' ? '' : ' · ' + (c.vencida ? c.ventana : c.cuando))) : 'Todavía no hay visita';
  const ts = [now]; if (c && c.estado !== 'pospuesta') ts.push(c.ini_ts, c.fin_ts, c.ini0_ts || c.ini_ts, c.fin0_ts || c.fin_ts); its.forEach(k => ts.push(k.due_ts)); (r.eventos || []).forEach(e => { if (e.ts > now - 4 * DIA) ts.push(e.ts); });
  let d0 = dia0(Math.max(Math.min.apply(null, ts), now - 5 * DIA)), d1 = dia0(Math.max.apply(null, ts)); if (d1 - d0 < 4 * DIA) d1 = d0 + 4 * DIA; if (d1 - d0 > 13 * DIA) d1 = d0 + 13 * DIA;
  const dias = []; for (let d = d0; d <= d1; d += DIA) dias.push(d); const rh = RH(), Y = ts => (Math.min(H1, Math.max(H0, horaF(ts))) - H0) * rh, alto = (H1 - H0) * rh;
  GEO = { d0, dias, rh, now };
  let h = '<div class="dh"><div class="g"></div>' + dias.map(d => { const x = new Date(d - TZ + 12 * 3600000); return '<div class="d' + (d === dia0(now) ? ' hoy' : '') + '">' + DS[x.getUTCDay()].slice(0, 3) + ' ' + x.getUTCDate() + '</div>'; }).join('') + '</div><div class="body" id="cbody" style="height:' + alto + 'px"><div class="gut">';
  for (let hh = H0 + 1; hh < H1; hh++) h += '<span style="top:' + ((hh - H0) * rh) + 'px">' + (hh % 12 || 12) + (hh >= 12 ? ' pm' : ' am') + '</span>'; h += '</div>';
  dias.forEach((d, di) => {
    const dw = new Date(d - TZ + 12 * 3600000).getUTCDay(), hr = (r.horario || {})[dw]; let col = '';
    if (hr) col += '<div class="cerrado" style="top:0;height:' + ((hr[0] - H0) * rh) + 'px"></div><div class="cerrado" style="top:' + ((hr[1] - H0) * rh) + 'px;bottom:0"></div>'; else col += '<div class="cerrado" style="top:0;bottom:0"></div>';
    if (c && c.estado !== 'pospuesta') {
      const tramo = (a, b, cls, txt) => { if (dia0(a) !== d && dia0(b) !== d) return ''; const y = Y(a), hh2 = Math.max(a === b ? rh : 18, Y(b) - y); return '<div class="visita ' + cls + '" data-v="1" style="top:' + y + 'px;height:' + hh2 + 'px">' + txt + '</div>'; };
      const abre = d + (hr ? hr[0] : H0) * 3600000, cierra = d + (hr ? hr[1] : H1) * 3600000;
      if (c.ventana_original && c.viva) { const o0 = Math.max(c.ini0_ts, abre), o1 = Math.min(c.fin0_ts, cierra); if (o1 > o0) col += tramo(o0, o1, 'orig', ''); }
      const exacta = c.precision === 'hora'; const cls = c.vencida ? 'vencida' : (c.estado === 'en_camino' ? 'camino' : (!c.viva ? 'fin' : (exacta ? '' : 'abierta')));
      const a0 = exacta ? c.ini_ts : Math.max(c.ini_ts, abre), a1 = exacta ? c.ini_ts : Math.min(c.fin_ts, cierra);
      if (dia0(a0) === d && a1 >= a0) col += tramo(a0, a1, cls, 'VISITA' + (c.vencida ? ' VENCIDA' : '') + '<small>' + esc(exacta ? fmt(c.ini_ts).split(' · ')[1] : (c.precision === 'franja' ? 'entre ' + fmt(c.ini_ts).split(' · ')[1] + ' y ' + fmt(c.fin_ts).split(' · ')[1] : 'hora abierta')) + '</small><small>' + esc(c.auto || '') + '</small>');
    }
    const mios = its.map((k, i) => Object.assign({ i }, k)).filter(k => dia0(k.due_ts) === d);
    const ys = mios.filter(k => k.cls !== 'muerto').map(k => Y(k.due_ts)); if (c && c.estado !== 'pospuesta' && dia0(c.ini_ts) === d) ys.push(Y(c.ini_ts)); if (ys.length > 1) col += '<div class="hilo" style="top:' + Math.min.apply(null, ys) + 'px;height:' + (Math.max.apply(null, ys) - Math.min.apply(null, ys)) + 'px"></div>';

function xyDe(ts){ const b = $('cbody'); const cols = b.querySelectorAll('.dcol'); const di = Math.max(0, Math.min(GEO.dias.length - 1, Math.round((dia0(ts) - GEO.d0) / DIA))); const c = cols[di]; return { x: c.offsetLeft + c.offsetWidth / 2, y: (Math.min(H1, Math.max(H0, horaF(ts))) - H0) * GEO.rh }; }

  const t = TURNOS[VER]; let ev = '', evs = '', es = '', ess = '', fj = [], det = [];
  const sig = EST && EST.cita ? items(EST).find(k => k.cls === 'sig') : null; const sigTxt = VER === 0 ? (sig ? 'Sigue: ' + fmt(sig.due_ts) + ' — ' + (SIGUE[sig.tipo] || sig.tipo) : 'No queda nada programado') : '';
  if (t.tipo === 'mensaje') {
    const T = t.traza || {}, L = T.lectura || {}, A = T.acciones || {}; const deCita = t.evento && !['no_es_de_cita', 'intencion'].includes(t.evento);
    ev = ENTENDI[t.evento] || ENTENDI[L.evento] || 'No habló de la visita'; if (t.evento === 'agenda_o_cambio') ev = T.antes && T.antes.estado !== 'pospuesta' ? 'Cambió el cuándo' : (T.antes ? 'Dio fecha otra vez' : 'Agendó una visita');
    evs = '“' + corto(t.texto, 90) + '”' + ((T.ajustes || []).length ? '\n⚠ ' + T.ajustes.join(' · ') : '');
    const a = resumenFoto(T.antes), d = resumenFoto(T.despues); const eA = T.antes ? (EST_TXT[T.antes.estado] || T.antes.estado) : null, eD = T.despues ? (EST_TXT[T.despues.estado] || T.despues.estado) : 'Sin visita';
    if (!deCita) { es = esc(T.antes ? eA : 'Sin visita'); ess = 'No cambió' + (T.antes ? ': ' + a : ''); } else { es = (eA && eA !== eD ? '<span class="a">' + esc(eA) + '</span> → ' : '') + esc(eD); ess = (T.antes && a !== d ? a + ' → ' : '') + d; }
    if (T.comercial) fj.push(T.comercial.respondida ? 'Seb contestó la parte comercial (“' + corto(T.comercial.texto, 40) + '”)' : 'Te pasé la pregunta comercial a ti');
    if (deCita) { const msgs = (A.mensajes || []).filter(x => !/^📍/.test(x)); if (msgs.length) fj.push('Le contesté: “' + corto(msgs.join(' · '), 110) + '”'); if ((A.mensajes || []).some(x => /^📍/.test(x))) fj.push('Le mandé la ubicación'); (A.avisos_vendedor || []).forEach(x => fj.push('Te avisé: “' + corto(x, 100) + '”')); const nc = (A.recordatorios_cancelados || []).length, nn = (A.recordatorios_creados || []).length; if (nc || nn) fj.push((nc ? 'Cancelé ' + nc + ' programados' : '') + (nc && nn ? ' · ' : '') + (nn ? 'Programé ' + nn + ' nuevos' : '')); }
    else { const sb = t.seb || {}; fj.push((sb.textos || []).length ? 'Seb contestó: “' + corto(sb.textos.join(' · '), 120) + '”' : (sb.escalar ? 'No contesté: te lo pasé a ti (' + (sb.escala_motivo || '') + ')' : 'Seb no contestó nada')); }

// ═══ chat y acciones (todas contra el motor real) ═══
async function cargarChat(){
  if (!CHAT) { $('chat').innerHTML = '<div class="vacio">Crea un cliente de prueba con “+ Cliente”.</div>'; return; }
  const r = await get('hilo', { chat_id: CHAT, antes: Date.now() + DIA * 400, limit: 60 }); if (!r.ok) return;
  const ms = (r.mensajes || []).slice().sort((a, b) => (a.ts || 0) - (b.ts || 0)).filter(m => m.emisor !== 'sistema');
  $('chat').innerHTML = ms.map(m => { const tx = m.media && m.media.tipo === 'ubicacion' ? '📍 Ubicación: ' + (m.media.nombre || '') : (m.media && m.media.tipo === 'imagen' ? '🖼 Captura del punto de venta' : String(m.texto || '')); return '<div class="m ' + (m.dir === 'in' ? 'in' : 'out') + '"><small>' + (m.dir === 'in' ? 'cliente' : 'TERRA') + '</small>' + esc(tx) + '</div>'; }).join('') || '<div class="vacio">Sin mensajes. Escribe abajo.</div>';
  const s = $('chatScr'); s.scrollTop = s.scrollHeight;
}
async function cargarEstado(){ EST = CHAT ? await post('citaf_estado', { chat_id: CHAT }) : null; pintarCal(); }
function bloquear(on){ OCUPADO = on; document.querySelectorAll('#send,.bar button,#chips button,#nuevo,#borrar').forEach(b => b.disabled = on); }
async function enviar(texto){
  texto = String(texto || '').trim(); if (!texto || OCUPADO || !CHAT) return; $('tx').value = ''; bloquear(true); sinTip();
  $('chat').insertAdjacentHTML('beforeend', '<div class="m in"><small>cliente</small>' + esc(texto) + '</div><div class="m out pens">pensando…</div>'); const s = $('chatScr'); s.scrollTop = s.scrollHeight;
  try { const a = await post('demo_responder', { chat_id: CHAT, texto }); if (!a.ok) throw new Error(a.error || 'no se registró el mensaje'); const r = await post('seb_turno', { chat_id: CHAT }); const cf = r.cita_flex || null; TURNOS.unshift({ tipo: 'mensaje', texto, evento: cf ? cf.evento : null, traza: cf ? cf.traza : null, seb: r.seb || null, comercial: r.comercial || null }); }
  catch (e) { TURNOS.unshift({ tipo: 'vendedor', titulo: 'Error', ok: false, error: e.message }); }
  VER = 0; await Promise.all([cargarChat(), cargarEstado()]); pintarFranja(); bloquear(false); $('tx').focus();
}
async function reloj(body){ if (OCUPADO || !CHAT) return; bloquear(true); sinTip(); const r = await post('citaf_reloj', Object.assign({ chat_id: CHAT }, body)); if (r.ok) { TURNOS.unshift({ tipo: 'reloj', ahora: r.reloj ? r.reloj.ahora : '', hechas: r.sin_siguiente ? [] : (r.hechas || []) }); EST = r; } else TURNOS.unshift({ tipo: 'vendedor', titulo: 'Reloj', ok: false, error: r.error }); VER = 0; await cargarChat(); if (!r.ok) await cargarEstado(); else pintarCal(); pintarFranja(); bloquear(false); }
async function vendedor(evento, extra){ if (OCUPADO || !CHAT) return; bloquear(true); sinTip(); const r = await post('citaf_vendedor', Object.assign({ chat_id: CHAT, evento }, extra || {})); TURNOS.unshift({ tipo: 'vendedor', titulo: ({ llego: 'Marcaste que SÍ llegó', no_llego: 'Marcaste que NO llegó' }[evento] || evento), ok: !!r.ok, res: r.vendedor || null, error: r.error }); if (r.ok) EST = r; VER = 0; await cargarChat(); if (!r.ok) await cargarEstado(); else pintarCal(); pintarFranja(); bloquear(false); }
async function cargarChats(sel){ const r = await get('inbox', { limit: 100, filtro: 'todos' }); const l = r.chats || []; const o = $('chats'); o.innerHTML = l.length ? l.map(c => '<option value="' + c.chat_id + '" data-tel="' + esc(String(c.telefono || '')) + '">' + esc((c.nombre && c.nombre !== '.' ? c.nombre : '+' + String(c.telefono || '')) + (c.cita ? ' · con visita' : '')) + '</option>').join('') : '<option value="">(sin clientes)</option>'; if (sel && l.some(c => Number(c.chat_id) === Number(sel))) o.value = String(sel); CHAT = o.value ? Number(o.value) : null; }
async function abrir(){ TURNOS = []; VER = 0; delete $('calwrap').dataset.visto; pintarFranja(); await Promise.all([cargarChat(), cargarEstado()]); }
async function nuevoCliente(){
  if (OCUPADO) return; bloquear(true); const autos = (TEN && TEN.autos) || []; if (!autos.length) { alert('Este universo no tiene autos.'); bloquear(false); return; }
  const usados = new Set([...$('chats').options].map(o => String(o.dataset.tel || '').slice(-2))); const libres = []; for (let n = 10; n <= 99; n++) { const x = String(n); if (!usados.has(x)) libres.push(x); } if (!libres.length) { alert('Ya hay 90 clientes de prueba: borra alguno.'); bloquear(false); return; }
  const tel = '52100000000' + libres[Math.floor(Math.random() * libres.length)];
  const r = await post('delegar_v2', { telefono: tel, nombre: 'Cliente ' + tel.slice(-2), auto_id: autos[0].id, entrada: { modo: 'silencio', entrante: true }, clave: clave('entrena') });
  if (!r.ok || !r.chat_id) { alert(r.error || 'No pude crear el cliente'); bloquear(false); return; } await cargarChats(r.chat_id); await abrir(); bloquear(false); $('tx').focus();

(async () => {
  const t = await get('tenant_info', {});
  if (!t.ok) { $('app').innerHTML = '<div class="err" style="grid-column:1/-1"><b>' + (t._status === 401 || t.login ? 'Primero entra a FyraChat en este navegador' : 'No pude abrir el universo') + '</b>' + esc(t.error || '') + '<br><br><a href="/fyrachat.html?vendedor=' + encodeURIComponent(VEND) + '">Abrir FyraChat</a> y luego vuelve a esta página.</div>'; return; }
  TEN = Object.assign({}, t.tenant, { autos: t.autos || [] }); if (!TEN.citas_flex) { $('app').innerHTML = '<div class="err" style="grid-column:1/-1"><b>Este universo no tiene las visitas flexibles encendidas</b>El playground es de TERRA MOTORS.</div>'; return; }
  $('chips').innerHTML = FRASES.map(f => '<button>' + esc(f) + '</button>').join(''); $('chips').onclick = e => { const b = e.target.closest('button'); if (b) enviar(b.textContent); };
  $('send').onclick = () => enviar($('tx').value); $('tx').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar($('tx').value); } };
  $('chats').onchange = () => { CHAT = $('chats').value ? Number($('chats').value) : null; abrir(); }; $('nuevo').onclick = nuevoCliente; $('borrar').onclick = borrarCliente;
  $('bSig').onclick = () => reloj({ accion: 'siguiente' }); $('bHoy').onclick = () => reloj({ accion: 'reset' }); $('bLlego').onclick = () => vendedor('llego'); $('bNo').onclick = () => vendedor('no_llego');
  addEventListener('resize', () => { if (EST) pintarCal(); });
  await cargarChats(Number(QS.get('chat')) || null); await abrir();
})();
