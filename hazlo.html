<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>HazloGPT</title>
<meta name="description" content="Pregunta por los autos seminuevos de Fyradrive en Monterrey, míralos y agenda tu cita.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--az:#2F7CF6;--az2:#1D4ED8;--azs:#EAF2FF;--ink:#0B1730;--ink2:#4B5670;--mut:#8A94A8;--ln:#E4E8F0;--bg:#FFFFFF;--bg2:#F7F9FC;--r:14px;--f:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--f);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100dvh}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);z-index:5}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo .w{font-weight:800;font-size:17px;letter-spacing:-.02em;padding:6px 14px;border:1.5px solid var(--az);border-radius:999px;color:var(--ink)}
.logo .w em{font-style:normal;color:var(--az)}
.logo small{color:var(--mut);font-weight:600;font-size:12px}
.top a.fy{color:var(--ink2);font-weight:600;font-size:13px;text-decoration:none;border:1px solid var(--ln);border-radius:999px;padding:7px 12px}.top a.fy:hover{border-color:var(--az);color:var(--az)}
.wrap{flex:1;width:100%;max-width:820px;margin:0 auto;padding:22px 16px 120px}
.hello{padding:48px 0 24px;text-align:left}
.hello h1{font-size:30px;line-height:1.15;letter-spacing:-.03em;margin:0 0 8px;font-weight:800}.hello h1 span{color:var(--az)}
.hello p{margin:0 0 20px;color:var(--ink2);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--ln);background:#fff;border-radius:999px;padding:9px 14px;font:600 13px var(--f);color:var(--ink);cursor:pointer}.chip:hover{border-color:var(--az);color:var(--az);background:var(--azs)}
.msgs{display:flex;flex-direction:column;gap:18px}
.m{display:flex;flex-direction:column;gap:10px;max-width:100%}
.m.u{align-items:flex-end}
.b{padding:11px 15px;border-radius:18px;max-width:80%;white-space:pre-wrap;word-wrap:break-word}
.m.u .b{background:var(--az);color:#fff;border-bottom-right-radius:6px}
.m.a .b{background:var(--bg2);border-bottom-left-radius:6px;color:var(--ink)}
.m.a .b.think{color:var(--mut)}
.m.a .b.think i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--az);margin-right:4px;animation:p 1s infinite}.m.a .b.think i:nth-child(2){animation-delay:.2s}.m.a .b.think i:nth-child(3){animation-delay:.4s}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
.who{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin:0 4px}
/* carrusel */
.car{position:relative}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 2px 6px;-webkit-overflow-scrolling:touch}.rail::-webkit-scrollbar{display:none}
.cd{flex:0 0 250px;scroll-snap-align:start;border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;background:#fff;transition:box-shadow .15s}.cd:hover{box-shadow:0 6px 24px rgba(11,23,48,.08)}
.cd .ph{aspect-ratio:16/10;background:var(--bg2);position:relative;overflow:hidden}.cd .ph img{width:100%;height:100%;object-fit:cover;display:block}
.cd .ph .k{position:absolute;left:8px;top:8px;background:rgba(11,23,48,.72);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.cd .bd{padding:10px 12px 12px}
.cd .t{font-weight:700;font-size:14px;line-height:1.25;letter-spacing:-.01em;min-height:36px}
.cd .pr{font-weight:800;font-size:16px;margin:4px 0 2px;color:var(--ink)}
.cd .s{color:var(--mut);font-size:12px;font-weight:600}
.cd .ac{display:flex;gap:6px;margin-top:10px}
.cd .ac a,.cd .ac button{flex:1;height:34px;border-radius:9px;font:700 12.5px var(--f);display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;border:1px solid var(--ln);background:#fff;color:var(--ink)}
.cd .ac button.p{background:var(--az);border-color:var(--az);color:#fff}.cd .ac button.p:hover{background:var(--az2)}
.arr{position:absolute;top:38%;width:36px;height:36px;border-radius:50%;border:1px solid var(--ln);background:#fff;box-shadow:0 2px 10px rgba(11,23,48,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;color:var(--ink)}
.arr.l{left:-10px}.arr.r{right:-10px}.arr[hidden]{display:none}
.cnt{font-size:12px;color:var(--mut);font-weight:600;margin:6px 4px 0}
.wa{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;font-weight:800;border-radius:999px;padding:11px 18px;text-decoration:none;font-size:14px}
/* composer */
.dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,#fff 30%);padding:18px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.box{max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;border:1.5px solid var(--ln);border-radius:22px;padding:8px 8px 8px 16px;background:#fff;box-shadow:0 8px 30px rgba(11,23,48,.08)}
.box:focus-within{border-color:var(--az)}
.box textarea{flex:1;border:0;outline:0;resize:none;font:500 15px/1.4 var(--f);color:var(--ink);max-height:120px;padding:8px 0;background:transparent}
.box button{width:40px;height:40px;border-radius:50%;border:0;background:var(--az);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 40px}.box button[disabled]{background:var(--ln);color:var(--mut)}
.foot{max-width:820px;margin:8px auto 0;text-align:center;font-size:11px;color:var(--mut);font-weight:600}
@media (max-width:640px){.hello{padding:28px 0 18px}.hello h1{font-size:25px}.cd{flex-basis:220px}.arr{display:none}.b{max-width:92%}.top{padding:12px 14px}.logo small{display:none}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="/hazlo.html"><span class="w">Hazlo<em>GPT</em></span><small>por Fyradrive</small></a>
  <a class="fy" href="https://www.fyradrive.com" target="_blank" rel="noopener">fyradrive.com</a>
</header>
<main class="wrap">
  <section class="hello" id="hello">
    <h1>¿Qué auto <span>traes en mente?</span></h1>
    <p>Pregúntame por el inventario de Fyradrive, míralo aquí mismo y agenda tu cita para manejarlo en Monterrey.</p>
    <div class="chips">
      <button class="chip" data-q="¿Qué autos tienes?">¿Qué autos tienes?</button>
      <button class="chip" data-q="¿Qué japoneses tienes?">Japoneses</button>
      <button class="chip" data-q="Enséñame las SUV">SUV</button>
      <button class="chip" data-q="Pickups">Pickups</button>
      <button class="chip" data-q="Algo de menos de 350 mil">Menos de $350 mil</button>
      <button class="chip" data-q="Quiero agendar una cita">Agendar cita</button>
    </div>
  </section>
  <section class="msgs" id="msgs"></section>
</main>
<div class="dock">
  <form class="box" id="form">
    <textarea id="in" rows="1" placeholder="Escribe aquí… por ejemplo: ¿qué SUV tienes de menos de 400 mil?" autocomplete="off"></textarea>
    <button type="submit" id="go" aria-label="Enviar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
  <div class="foot">Autos verificados por Fyradrive · Monterrey, N.L.</div>
</div>
<script>
const API='/api/hazlo';const $=s=>document.querySelector(s);
const msgs=$('#msgs'),inp=$('#in'),go=$('#go');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'':'$'+Number(n).toLocaleString('es-MX');
let hist=[],cita=null,busy=false;const ses=(()=>{try{let s=sessionStorage.getItem('hz');if(!s){s=Math.random().toString(36).slice(2,12);sessionStorage.setItem('hz',s)}return s}catch(e){return 'x'}})();
function add(rol,html,opts){const m=document.createElement('div');m.className='m '+(rol==='user'?'u':'a');m.innerHTML=(rol==='user'?'':'<div class="who">HazloGPT</div>')+html;msgs.appendChild(m);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});return m}
function card(a){return '<article class="cd"><div class="ph">'+(a.foto?'<img loading="lazy" src="'+esc(a.foto)+'" alt="'+esc(a.nombre)+'">':'')+(a.anio?'<span class="k">'+a.anio+'</span>':'')+'</div><div class="bd"><div class="t">'+esc(a.nombre)+'</div><div class="pr">'+fmt(a.precio)+'</div><div class="s">'+(a.km?a.km.toLocaleString('es-MX')+' km':'')+(a.transmision?' · '+esc(a.transmision.toLowerCase()):'')+'</div><div class="ac"><a href="'+esc(a.link)+'" target="_blank" rel="noopener">Ver auto</a><button class="p" data-cita="'+a.id+'" data-n="'+esc(a.nombre)+'">Agendar cita</button></div></div></article>'}
function carrusel(autos){if(!autos||!autos.length)return '';const id='c'+Math.random().toString(36).slice(2,7);return '<div class="car" data-c="'+id+'"><button class="arr l" aria-label="Anterior">&#8249;</button><div class="rail">'+autos.map(card).join('')+'</div><button class="arr r" aria-label="Siguiente">&#8250;</button></div>'+(autos.length>1?'<div class="cnt">'+autos.length+' autos · desliza o usa las flechas</div>':'')}
msgs.addEventListener('click',e=>{const a=e.target.closest('.arr');if(a){const r=a.parentElement.querySelector('.rail');r.scrollBy({left:(a.classList.contains('l')?-1:1)*(r.clientWidth-40),behavior:'smooth'});return}
  const b=e.target.closest('button[data-cita]');if(b){enviar('Quiero agendar cita para ver el '+b.dataset.n,{auto_id:Number(b.dataset.cita)})}});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>enviar(c.dataset.q));
$('#form').onsubmit=e=>{e.preventDefault();const t=inp.value.trim();if(t)enviar(t)};
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#form').requestSubmit()}});
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px'});
async function enviar(texto,extra){if(busy)return;busy=true;go.disabled=true;$('#hello').style.display='none';inp.value='';inp.style.height='auto';
  add('user','<div class="b">'+esc(texto)+'</div>');hist.push({rol:'user',texto});
  const th=add('a','<div class="b think"><i></i><i></i><i></i></div>');
  let r;try{const c=extra&&extra.auto_id?Object.assign({},cita||{},{auto_id:extra.auto_id}):cita;r=await fetch(API+'?action=chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mensaje:texto,historial:hist.slice(-8),cita:c,sesion:ses})}).then(x=>x.json())}catch(e){r={ok:false}}
  th.remove();
  if(!r||!r.ok){add('a','<div class="b">'+esc((r&&r.error)||'Se me fue la señal un segundo, ¿me lo repites?')+'</div>');busy=false;go.disabled=false;return}
  cita=r.cita||null;hist.push({rol:'a',texto:r.texto});
  add('a','<div class="b">'+esc(r.texto)+'</div>'+carrusel(r.autos)+(r.wa?'<div><a class="wa" href="'+esc(r.wa)+'" target="_blank" rel="noopener">Confirmar por WhatsApp</a></div>':''));
  busy=false;go.disabled=false;inp.focus()}
</script>
</body>
</html>
